<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="WealthPilot">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#595CD9">
<title>WealthPilot</title>
<style>
:root{
  --income:#21A16B; --outgo:#DB4F4F; --wealth:#595CD9; --goals:#F09930;
  --safety:#1A9EA8; --danger:#CC333D;
  --bg:#EFEFF4; --surface:#FFFFFF; --inset:#F2F2F7;
  --text:#000000; --text2:#6C6C70; --text3:#A0A0A5; --line:#00000014;
  --radius:16px;
}
@media (prefers-color-scheme: dark){
  :root{ --bg:#000000; --surface:#1C1C1E; --inset:#2C2C2E;
    --text:#FFFFFF; --text2:#98989F; --text3:#6C6C70; --line:#FFFFFF1A; }
}
html[data-theme="light"]{ --bg:#EFEFF4; --surface:#FFFFFF; --inset:#F2F2F7;
  --text:#000; --text2:#6C6C70; --text3:#A0A0A5; --line:#00000014; }
html[data-theme="dark"]{ --bg:#000; --surface:#1C1C1E; --inset:#2C2C2E;
  --text:#FFF; --text2:#98989F; --text3:#6C6C70; --line:#FFFFFF1A; }

*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;height:100%;}
body{
  background:var(--bg); color:var(--text);
  font:400 15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;}
input,select{font:inherit;color:inherit;}
.rnd{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,system-ui,sans-serif;}

/* ---------- shell ---------- */
#app{display:flex;flex-direction:column;height:100dvh;max-width:520px;margin:0 auto;background:var(--bg);}
#nav{
  flex:0 0 auto; display:flex; align-items:center; gap:8px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line); position:sticky; top:0; z-index:20;
}
#nav .title{font-weight:700;font-size:17px;flex:1;text-align:center;}
#nav .slot{min-width:64px;display:flex;align-items:center;gap:12px;}
#nav .slot.right{justify-content:flex-end;}
#nav button.link{color:var(--wealth);font-size:15px;display:flex;align-items:center;gap:2px;}
#screen{flex:1 1 auto;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:14px 14px 24px;}
#tabbar{
  flex:0 0 auto; display:flex; border-top:1px solid var(--line);
  background:color-mix(in srgb, var(--bg) 82%, transparent);
  backdrop-filter:saturate(180%) blur(20px); -webkit-backdrop-filter:saturate(180%) blur(20px);
  padding-bottom:env(safe-area-inset-bottom);
}
#tabbar button{flex:1;padding:8px 0 6px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text3);}
#tabbar button.on{color:var(--wealth);}
#tabbar span{font-size:10px;font-weight:600;}

/* ---------- primitives ---------- */
.stack{display:flex;flex-direction:column;gap:14px;}
.card{background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:10px;}
.card.tight{gap:6px;}
.card.tap{cursor:pointer;}
.card.tap:active{opacity:.6;}
.sect{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;letter-spacing:.06em;color:var(--text2);text-transform:uppercase;}
.sect svg{width:13px;height:13px;}
.hero{font-size:36px;font-weight:700;line-height:1.05;letter-spacing:-.02em;}
.big{font-size:24px;font-weight:700;}
.num{font-size:17px;font-weight:600;}
.sml{font-size:13px;font-weight:600;}
.note{font-size:11.5px;color:var(--text2);line-height:1.45;}
.note.t3{color:var(--text3);}
.row{display:flex;align-items:center;gap:8px;font-size:13px;}
.row .lbl{color:var(--text2);}
.row .lbl.em{color:var(--text);}
.row .sp{flex:1;min-width:8px;}
.row .val{font-size:13px;font-weight:600;text-align:right;}
.row .val.em{font-size:17px;}
.row svg{width:16px;height:16px;flex:0 0 18px;color:var(--text2);}
.divider{height:1px;background:var(--line);margin:2px 0;}
.pill{display:inline-block;font-size:10px;font-weight:700;padding:4px 9px;border-radius:99px;white-space:nowrap;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.tile{background:var(--surface);border-radius:var(--radius);padding:14px;display:flex;flex-direction:column;gap:4px;}
.tile .k{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--text2);}
.tile .k svg{width:11px;height:11px;}
.tile .v{font-size:22px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.tile .c{font-size:11px;color:var(--text3);}
.avatar{width:40px;height:40px;border-radius:99px;display:grid;place-items:center;flex:0 0 40px;}
.avatar svg{width:18px;height:18px;}
.avatar.sm{width:36px;height:36px;flex-basis:36px;}
.bar{height:8px;border-radius:99px;background:var(--inset);overflow:hidden;}
.bar > i{display:block;height:100%;border-radius:99px;}
.inset{background:var(--inset);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;}
.chev{width:12px;height:12px;color:var(--text3);flex:0 0 12px;}
.seg{display:flex;background:var(--inset);border-radius:9px;padding:2px;gap:2px;margin-bottom:12px;}
.seg button{flex:1;padding:6px 4px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--text2);}
.seg button.on{background:var(--surface);color:var(--text);box-shadow:0 1px 3px #0000001f;}
.addbtn{background:var(--surface);border-radius:var(--radius);padding:16px;display:flex;align-items:center;gap:8px;color:var(--wealth);font-size:14px;font-weight:600;}
.addbtn svg{width:18px;height:18px;}
.banner{border-radius:18px;padding:18px;color:#fff;background:linear-gradient(135deg,#292A6B,#1A5C7A);display:flex;flex-direction:column;gap:8px;}
.banner .k{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.08em;opacity:.75;}
.banner .k svg{width:12px;height:12px;}
.banner .v{font-size:15px;font-weight:600;line-height:1.4;}

/* ---------- fields ---------- */
.fld{display:flex;flex-direction:column;gap:7px;}
.fld .top{display:flex;align-items:center;gap:8px;}
.fld .top label{font-size:13px;color:var(--text2);flex:1;}
.fld input[type=number],.fld input[type=text]{
  width:120px;text-align:right;background:var(--inset);border:0;border-radius:8px;
  padding:6px 10px;font-size:13px;font-weight:600;-moz-appearance:textfield;}
.fld input[type=text].wide{width:100%;text-align:left;}
.fld input::-webkit-outer-spin-button,.fld input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0;}
.fld .sfx{font-size:12px;color:var(--text3);}
input[type=range]{width:100%;accent-color:var(--wealth);height:22px;}
.toggle{display:flex;align-items:center;gap:8px;font-size:13px;}
.toggle .sp{flex:1;}
.sw{width:44px;height:26px;border-radius:99px;background:var(--inset);position:relative;transition:background .15s;flex:0 0 44px;}
.sw.on{background:var(--income);}
.sw i{position:absolute;top:2px;left:2px;width:22px;height:22px;border-radius:99px;background:#fff;box-shadow:0 1px 3px #0003;transition:transform .15s;}
.sw.on i{transform:translateX(18px);}
.symrow{display:flex;gap:10px;overflow-x:auto;padding:4px 0;}
.symrow button{width:40px;height:40px;border-radius:99px;background:var(--inset);display:grid;place-items:center;flex:0 0 40px;color:var(--text2);}
.symrow button.on{background:var(--wealth);color:#fff;}
.symrow svg{width:18px;height:18px;}

/* ---------- sheet ---------- */
#sheet{position:fixed;inset:0;z-index:60;display:none;}
#sheet.open{display:block;}
#sheet .scrim{position:absolute;inset:0;background:#0006;}
#sheet .panel{
  position:absolute;left:0;right:0;bottom:0;max-height:92dvh;max-width:520px;margin:0 auto;
  background:var(--bg);border-radius:16px 16px 0 0;display:flex;flex-direction:column;
  animation:up .22s ease;}
@keyframes up{from{transform:translateY(100%)}to{transform:translateY(0)}}
#sheet .head{display:flex;align-items:center;padding:14px;border-bottom:1px solid var(--line);}
#sheet .head .t{flex:1;text-align:center;font-weight:700;font-size:16px;}
#sheet .head button{color:var(--wealth);font-size:15px;min-width:64px;}
#sheet .head button.done{text-align:right;font-weight:700;}
#sheet .body{overflow-y:auto;padding:14px 14px calc(env(safe-area-inset-bottom) + 24px);display:flex;flex-direction:column;gap:14px;}
.danger{color:var(--danger);}
.center{text-align:center;}
svg.chart{display:block;width:100%;overflow:visible;}
.legend{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}
.legend div{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--text2);}
.legend i{width:14px;height:3px;border-radius:99px;display:block;}
</style>
</head>
<body>

</div>
<div id="sheet"><div class="scrim"></div><div class="panel"><div class="head"></div><div class="body"></div></div></div>

let PRIVACY = false;
function fmt(v){
  if (PRIVACY) return "₹ ✱✱✱";
  if (!isFinite(v)) v = 0;
  const a = Math.abs(v);
  if (a >= 1e7) return "₹" + (v/1e7).toFixed(2) + "Cr";
  if (a >= 1e5) return "₹" + (v/1e5).toFixed(1) + "L";
  return "₹" + Math.round(v).toLocaleString("en-IN");
}
function fmtAxis(v){
  if (PRIVACY) return "✱";
  const a = Math.abs(v);
  if (a >= 1e7) return (v/1e7).toFixed(1)+"Cr";
  if (a >= 1e5) return Math.round(v/1e5)+"L";
  return String(Math.round(v));
}

function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

const FREQ = {
  monthly:   { label:"Monthly",     interval:1  },
  quarterly: { label:"Quarterly",   interval:3  },

  yearly:    { label:"Yearly",      interval:12 }
};
const perYear = rp => rp.amount * (12 / FREQ[rp.frequency].interval);
const perMonthAvg = rp => perYear(rp) / 12;
const anchorIdx = rp => Math.round(rp.anchorYear) * 12 + Math.round(rp.anchorMonth) - 1;
function isDue(rp, idx){
  if (!rp.enabled || idx < anchorIdx(rp)) return false;
  return (idx - anchorIdx(rp)) % FREQ[rp.frequency].interval === 0;
}
function dueAmount(rp, idx, inflation){
  if (!isDue(rp, idx)) return 0;
  if (!rp.inflate) return rp.amount;
  const years = Math.floor(idx/12) - rp.anchorYear;
  return years > 0 ? rp.amount * Math.pow(1 + inflation/100, years) : rp.amount;
}
const fundedTarget = g => g.target * Math.min(100, Math.max(1, g.downPct)) / 100;
const financed = g => g.target - fundedTarget(g);

function checkInStreak(){
  const h = [...STORE.history].sort((a,b)=> new Date(b.date) - new Date(a.date));
  if (!h.length) return 0;
  const mi = d => { const x = new Date(d); return x.getFullYear()*12 + x.getMonth(); };
  let streak = 1;
  for (let i=1;i<h.length;i++){ if (mi(h[i].date) === mi(h[0].date) - i) streak++; else break; }
  return streak;
}
function snapLiquid(s){ return s.us + s.ind + s.carFund + s.fdSavings; }
function snapDrift(s){ return snapLiquid(s) - s.planned; }
function onPlanStreak(){
  let n = 0;
  for (const s of [...STORE.history].sort((a,b)=> new Date(b.date)-new Date(a.date))){
    if (snapDrift(s) >= 0) n++; else break;
  }
  return n;
}
function addSnapshot(s){
  const mi = d => { const x = new Date(d); return x.getFullYear()*12 + x.getMonth(); };
  STORE.history = STORE.history.filter(x => mi(x.date) !== mi(s.date));
  STORE.history.push(s);
  STORE.history.sort((a,b)=> new Date(a.date) - new Date(b.date));
}

/* ---------------- net worth ---------------- */
function netWorthOf(a, c, cards){
  const liquidGoalSavings = c.goals.filter(g => g.enabled && g.bucket === "liquid")
                                   .reduce((t,g)=> t + (g.actual||0), 0);
  const n = {
    us:a.usValue, ind:a.inValue, emergency:a.fdSavings, goalSavings:liquidGoalSavings,
    epf:a.epf, nps:a.nps,
    chennai:a.homeProperty, agartala:a.secondProperty, vehicle:a.vehicle,
    personalLoan:a.plOutstanding, chennaiLoan:c.chBal,
    cardDues:(cards||[]).reduce((t,x)=> t + (x.due||0), 0)
  };
  n.liquid = n.us + n.ind + n.emergency + n.goalSavings;
  n.locked = n.epf + n.nps;
  n.hard = n.chennai + n.agartala + n.vehicle;
  n.assets = n.liquid + n.locked + n.hard;
  n.liabilities = n.personalLoan + n.chennaiLoan + n.cardDues;
  n.net = n.assets - n.liabilities;
  n.stocks = n.us + n.ind;
  n.stocksPct = n.net > 0 ? n.stocks / n.net * 100 : 0;
  return n;
}

/* ---------------- the engine ----------------
   Month index = year*12 + month(0-based). The plan runs for 14 years
   starting from the month the user opens the app.
   Ported from Engine.swift, with the personal assumptions lifted out
   into config so the plan describes whoever is using it.
----------------------------------------------- */
const PLAN_YEARS = 14;
const START_IDX = nowIdx();
const END_IDX   = START_IDX + PLAN_YEARS*12 - 1;
const START_YEAR = Math.floor(START_IDX/12);
const mr = annual => Math.pow(1 + annual/100, 1/12) - 1;

/* Gross monthly rent from the second property, before maintenance and EMI.
   Starts at spRentNow, steps up to spRentThen from spRentStartYear, then
   grows spGrowthPct every spGrowthEvery years. */
function spRent(c, year, month){
  if (!c.spEnabled) return 0;
  const startY = Math.round(c.spRentStartYear);
  if (year < startY) return c.spRentNow;
  const base = c.spRentThen > 0 ? c.spRentThen : c.spRentNow;
  const every = Math.max(1, Math.round(c.spGrowthEvery));
  return base * Math.pow(1 + c.spGrowthPct/100, Math.floor((year - startY) / every));
}
/* A bigger hike in job-switch years, every spGrowthEvery... years from the start. */
function isSwitchYear(c, y){
  const every = Math.round(c.hikeSwitchEvery || 0);
  if (every <= 0) return false;
  return y > START_YEAR && (y - START_YEAR) % every === 0;
}

function actualsOverride(a, goals){
  const ga = {};
  goals.forEach(g => ga[g.id] = g.actual || 0);
  return { atIdx: Math.max(START_IDX, nowIdx()), pl:a.plOutstanding, ef:a.fdSavings,
           us:a.usValue, ind:a.inValue, epf:a.epf, nps:a.nps, goalActuals:ga };
}

function simulate(c, seedUS, seedIN, override){
  const r = { states:[], plDone:null, chDone:null, agDone:null, efDone:null,
              intPL:0, intCH:0, intAG:0, goalFunded:{}, goalLoanClosed:{},
              goalLoanEMI:{}, goalLoanInterest:{}, need:0, expThen:0,
              rentalIncome:0, retAssets:0, atRetire:null };
  const goals = c.goals.filter(g => g.enabled);

  const blendAnnual = (c.usAlloc*c.usReturn + (100-c.usAlloc)*c.inReturn) / 100;
  const eqBlend = mr(blendAnnual);
  const usR = mr(c.usReturn), inR = mr(c.inReturn), lqR = mr(c.liquidRet);
  const epfR = mr(c.epfRate), npsR = mr(c.npsRate);

  let th = c.income, exp = c.rentExp + c.livingExp;
  let wife = c.depExp, chRent = c.otherIncome;
  let pl = c.plBal, ch = c.chBal, ag = c.spEnabled ? c.spBal : 0;
  let ef = 0, ret = 0;
  let epf = c.epfBal, nps = c.npsBal;
  let usV = seedUS, inV = seedIN;
  const goalVal = {}, goalLoan = {}, goalEMI = {};
  goals.forEach(g => { goalVal[g.id] = 0; goalLoan[g.id] = 0; goalEMI[g.id] = 0; });
  const cfYear = Math.round(c.windfallYear);

  for (let idx = START_IDX; idx <= END_IDX; idx++){
    const yr = Math.floor(idx/12), mo = idx % 12;
    if (mo === 0){
      th *= isSwitchYear(c, yr) ? 1 + c.hikeSwitch/100 : 1 + c.hikeAnnual/100;
      exp *= 1 + c.expInflation/100;
      wife *= 1 + c.expInflation/100;
      chRent *= 1 + c.expInflation/100;
    }
    const g = th / c.income;

    // Re-base on real balances at "now" when an override is supplied.
    if (override && idx === override.atIdx){
      pl = Math.max(0, override.pl); ef = override.ef;
      epf = override.epf; nps = override.nps;
      usV = override.us; inV = override.ind;
      const equity = override.us + override.ind;
      let eqGoalNotional = 0;
      goals.filter(x => x.bucket === "equity").forEach(x => eqGoalNotional += goalVal[x.id] || 0);
      const pool = eqGoalNotional + ret;
      if (pool > 0){
        const f = equity / pool;
        goals.filter(x => x.bucket === "equity").forEach(x => goalVal[x.id] = (goalVal[x.id]||0) * f);
        ret *= f;
      } else { ret = equity; }
      goals.forEach(gg => {
        if (gg.bucket === "liquid" && override.goalActuals[gg.id] !== undefined)
          goalVal[gg.id] = override.goalActuals[gg.id];
        if ((goalVal[gg.id]||0) >= fundedTarget(gg) && r.goalFunded[gg.id] === undefined)
          r.goalFunded[gg.id] = idx;
      });
      if (pl <= 0 && r.plDone === null) r.plDone = idx;
    }

    // --- loans ---
    if (ch > 0){
      const i = ch * c.chRate / 1200; r.intCH += i;
      ch += i - c.chEMI - c.chPrepay;
      if (ch <= 0){ ch = 0; r.chDone = idx; }
    }
    if (ag > 0){
      const i = ag * c.spRate / 1200; r.intAG += i;
      ag += i - c.spEMI - c.spPrepay;
      if (ag <= 0){ ag = 0; r.agDone = idx; }
    }
    let goalLoanEMIsDue = 0;
    for (const gg of goals){
      const bal = goalLoan[gg.id] || 0;
      if (bal <= 0) continue;
      const emi = goalEMI[gg.id] || 0;
      const i = bal * gg.loanRate / 1200;
      r.goalLoanInterest[gg.id] = (r.goalLoanInterest[gg.id] || 0) + i;
      const nb = bal + i - emi;
      goalLoanEMIsDue += emi;
      if (nb <= 0){
        goalLoan[gg.id] = 0; goalEMI[gg.id] = 0;
        if (r.goalLoanClosed[gg.id] === undefined) r.goalLoanClosed[gg.id] = idx;
      } else { goalLoan[gg.id] = nb; }
    }

    // --- income and surplus ---
    const famNet = spRent(c, yr, mo) * (1 - c.spMaint/100) - (ag > 0 ? c.spEMI : 0);
    const agInc = Math.max(0, famNet * c.spShare / 100);

    let recurringDue = 0;
    for (const rp of c.recurring) if (rp.enabled) recurringDue += dueAmount(rp, idx, c.expInflation);

    let surplus = th - exp + agInc + (chRent - wife) + c.extraSavings;
    if (ch > 0) surplus -= c.chEMI + c.chPrepay;
    if (pl > 0) surplus -= c.plEMI;
    surplus -= goalLoanEMIsDue;
    surplus -= recurringDue;

    let lump = 0;
    if (mo === 0 && yr > START_YEAR) lump += c.bonus * g;
    if (mo === 0 && yr === cfYear) ret += c.windfall;

    const s = { idx, year:yr, month:mo, th:0, exp:0, wifeExp:0, chRent:0,
                pl:0, ch:0, ag:0, ef:0, efTarget:0, recurring:0,
                ret:0, epf:0, nps:0, usV:0, inV:0,
                goalVal:{}, goalContrib:{}, goalLoan:{},
                actEF:0, actPL:0, actRet:0, surplus:0, agInc:0 };

    // --- phase 0: emergency fund ---
    const recurringMonthlyAvg = c.recurring.filter(x=>x.enabled).reduce((t,x)=> t + perMonthAvg(x), 0);
    const efTarget = c.efMonths * Math.max(0, exp + wife - agInc - chRent
      + (pl > 0 ? c.plEMI : 0)
      + (ch > 0 ? c.chEMI + c.chPrepay : 0)
      + goalLoanEMIsDue + recurringMonthlyAvg);
    ef *= 1 + lqR;
    let efC = 0;
    if (ef < efTarget){
      const fromLump = Math.min(lump, efTarget - ef);
      ef += fromLump; lump -= fromLump; efC += fromLump;
      const fromSurplus = Math.min(Math.max(0, efTarget - ef), Math.max(0, surplus) * c.efSplit / 100);
      ef += fromSurplus; surplus -= fromSurplus; efC += fromSurplus;
    }
    s.actEF = efC; s.efTarget = efTarget;
    if (r.efDone === null && ef >= efTarget && efTarget > 0) r.efDone = idx;

    // funds one goal from the running surplus / January lump
    const fund = (gg) => {
      let v = (goalVal[gg.id] || 0) * (1 + (gg.bucket === "liquid" ? lqR : eqBlend));
      const alreadyFunded = v >= fundedTarget(gg);
      let contrib = 0;
      if (!alreadyFunded){
        const steps = Math.max(0, yr - START_YEAR);
        const planned = gg.monthly * Math.pow(1 + gg.stepUpPct/100, steps);
        contrib = Math.min(planned, Math.max(0, surplus));
        surplus -= contrib;
        if (contrib < planned && lump > 0){
          const extra = Math.min(planned - contrib, lump);
          contrib += extra; lump -= extra;
        }
        v += contrib;
      }
      goalVal[gg.id] = v;
      s.goalContrib[gg.id] = contrib;

      // Mark the goal funded the first month its value reaches the target — however it
      // got there. A long-horizon goal often crosses on growth alone in a month it
      // receives no contribution; checking only contribution months missed those
      // entirely and left the goal reading "—" forever despite being achieved.
      if (v >= fundedTarget(gg) && r.goalFunded[gg.id] === undefined){
        r.goalFunded[gg.id] = idx;
        const fin = financed(gg);
        if (fin > 0 && (goalLoan[gg.id] || 0) <= 0 && gg.loanYears > 0){
          const rm = gg.loanRate / 1200;
          const n = gg.loanYears * 12;
          const emi = rm > 0 ? fin * rm * Math.pow(1+rm, n) / (Math.pow(1+rm, n) - 1) : fin / n;
          goalLoan[gg.id] = fin; goalEMI[gg.id] = emi; r.goalLoanEMI[gg.id] = emi;
        }
      }
    };

    // --- phase 1: goals that don't wait for the loan ---
    for (const gg of goals) if (!gg.afterDebtFree) fund(gg);

    // --- phase 2: blitz the personal loan ---
    if (pl > 0){
      const i = pl * c.plRate / 1200; r.intPL += i;
      const pay = Math.max(0, surplus) + lump;
      pl += i - c.plEMI - pay;
      s.actPL = pay;
      surplus = 0; lump = 0;
      if (pl <= 0){ pl = 0; r.plDone = idx; }
    }
    const debtFree = pl <= 0;

    // --- phase 3: remaining goals, in priority order ---
    for (const gg of goals){
      if (!gg.afterDebtFree) continue;
      if (debtFree) fund(gg); else s.goalContrib[gg.id] = 0;
    }

    // --- phase 4: retirement absorbs the remainder ---
    const retC = Math.max(0, surplus) + lump;
    ret = ret * (1 + eqBlend) + retC;
    s.actRet = retC;
    surplus = 0; lump = 0;

    // --- portfolio split & retirement accounts ---
    let equityContrib = retC;
    for (const gg of goals) if (gg.bucket === "equity") equityContrib += s.goalContrib[gg.id] || 0;
    if (mo === 0 && yr === cfYear) equityContrib += c.windfall;
    usV = usV * (1 + usR) + equityContrib * c.usAlloc / 100;
    inV = inV * (1 + inR) + equityContrib * (100 - c.usAlloc) / 100;

    epf = epf * (1 + epfR) + c.epfMonthly * g;
    nps = nps * (1 + npsR) + c.npsMonthly * g;

    s.th = th; s.exp = exp; s.wifeExp = wife; s.chRent = chRent;
    s.pl = Math.max(0, pl); s.ch = Math.max(0, ch); s.ag = Math.max(0, ag);
    s.ef = ef; s.ret = ret; s.recurring = recurringDue;
    s.epf = epf; s.nps = nps; s.usV = usV; s.inV = inV;
    s.goalVal = Object.assign({}, goalVal);
    s.goalLoan = Object.assign({}, goalLoan);
    s.goalContribTotal = Object.values(s.goalContrib).reduce((a,b)=>a+b, 0);
    s.goalsTotal = Object.values(s.goalVal).reduce((a,b)=>a+b, 0);
    s.surplus = efC + s.actPL + s.goalContribTotal + retC;
    s.agInc = agInc;
    r.states.push(s);
  }

  // --- retirement maths ---
  const retireYear = Math.round(c.retireYear);
  const yrsTo = retireYear - START_YEAR;
  r.expThen = (c.rentExp + c.livingExp) * Math.pow(1 + c.expInflation/100, yrsTo);
  const atR = r.states.find(s => s.year === retireYear && s.month === 5) || r.states[r.states.length-1];
  r.atRetire = atR;
  const agOpen = atR.ag > 0;
  const rentThen = spRent(c, retireYear+1, 0) * (1 - c.spMaint/100) - (agOpen ? c.spEMI : 0);
  r.rentalIncome = Math.max(0, rentThen * c.spShare / 100);
  r.need = Math.max(0, r.expThen - r.rentalIncome) * 12 / (c.swr / 100);
  r.retAssets = atR.ret + atR.epf + atR.nps;

  r.planNow = () => { const i = nowIdx(); let out = null; for (const s of r.states) if (s.idx <= i) out = s; return out; };
  r.yearly = r.states.filter(s => s.month === 5 || s.month === 11);
  r.finalValue = id => { const l = r.states[r.states.length-1]; return (l && l.goalVal[id]) || 0; };
  return r;
}

/* ---------------- derived helpers ---------------- */
function driftBreakdown(plan, c, a){
  const d = { planEF:0, planGoals:0, planRet:0, commonFundAdj:0,
              actUS:0, actIN:0, actEF:0, actGoalsLiquid:0,
              loanPlanned:0, loanActual:0, goalRows:[] };
  if (!plan) { d.planned = 0; d.actual = 0; d.drift = 0; d.loanDrift = 0; return d; }
  d.planEF = plan.ef; d.planRet = plan.ret;
  for (const g of c.goals){
    if (!g.enabled) continue;
    const planned = plan.goalVal[g.id] || 0;
    d.planGoals += planned;
    if (g.bucket === "liquid") d.actGoalsLiquid += g.actual || 0;
    d.goalRows.push({ id:g.id, name:g.name, planned, actual:g.actual||0 });
  }
  d.commonFundAdj = new Date().getFullYear() >= Math.round(c.windfallYear) ? c.windfall : 0;
  d.actUS = a.usValue; d.actIN = a.inValue; d.actEF = a.fdSavings;
  d.loanPlanned = plan.pl; d.loanActual = a.plOutstanding;
  d.planned = Math.max(0, d.planEF + d.planGoals + d.planRet - d.commonFundAdj);
  d.actual = d.actUS + d.actIN + d.actEF + d.actGoalsLiquid;
  d.drift = d.actual - d.planned;
  d.loanDrift = d.loanActual - d.loanPlanned;
  return d;
}

function goalImpacts(p, real, c){
  const dateRow = (id, name, symbol, pi, ri) => {
    const delta = (pi === null || pi === undefined || ri === null || ri === undefined) ? 0 : ri - pi;
    const txt = delta === 0 ? ""
      : (delta > 0 ? `${delta} month${delta === 1 ? "" : "s"} later`
                   : `${-delta} month${delta === -1 ? "" : "s"} earlier`);
    return { id, name, symbol, planText:monthName(pi), realText:monthName(ri), deltaText:txt, worse:delta > 0 };
  };
  const out = [ dateRow("ef", "Emergency fund", "lifepreserver.fill", p.efDone, real.efDone) ];
  if (STORE.config.plBal > 0 || (p.plDone !== null && p.plDone !== undefined))
    out.push(dateRow("pl", "Personal loan closed", "creditcard.fill", p.plDone, real.plDone));
  for (const g of c.goals){
    if (!g.enabled) continue;
    const pf = p.goalFunded[g.id], rf = real.goalFunded[g.id];
    if (pf !== undefined && rf !== undefined){
      out.push(dateRow(g.id, g.name, g.symbol, pf, rf));
    } else {
      const pv = p.finalValue(g.id), rv = real.finalValue(g.id);
      const delta = rv - pv;
      out.push({ id:g.id, name:g.name, symbol:g.symbol, planText:fmt(pv), realText:fmt(rv),
                 deltaText: Math.abs(delta) < 1000 ? "" : (delta >= 0 ? "+" : "") + fmt(delta),
                 worse: delta < 0 });
    }
  }
  const pf = p.need > 0 ? p.retAssets / p.need * 100 : 100;
  const rf = real.need > 0 ? real.retAssets / real.need * 100 : 100;
  out.push({ id:"ret", name:`Retirement ${Math.round(c.retireYear)}`, symbol:"beach.umbrella.fill",
             planText:`${Math.round(pf)}% funded`, realText:`${Math.round(rf)}% funded`,
             deltaText: Math.abs(rf-pf) < 0.5 ? "" : (rf-pf >= 0 ? "+" : "") + (rf-pf).toFixed(0) + " pts",
             worse: rf < pf });
  return out;
}

function deviationSummary(drift, impacts){
  const hurt = impacts.filter(i => i.worse && i.deltaText);
  const helped = impacts.filter(i => !i.worse && i.deltaText);
  if (drift < 0){
    if (!hurt.length) return `You're ${fmt(-drift)} behind plan, but no goal date has moved yet. Catching up now keeps it that way.`;
    const rest = hurt.length > 1 ? ` (and ${hurt.length-1} other goal${hurt.length === 2 ? "" : "s"})` : "";
    return `You're ${fmt(-drift)} behind. ${hurt[0].name} slips ${hurt[0].deltaText}${rest}.`;
  } else if (drift > 0){
    if (!helped.length) return `You're ${fmt(drift)} ahead of plan. Keep going.`;
    return `You're ${fmt(drift)} ahead. ${helped[0].name} moves ${helped[0].deltaText}.`;
  }
  return "You're exactly on plan.";
}

const incomeOf = m => m.th + m.agInc + m.chRent;
function outgoOf(m, c, goalEMIs){
  return m.exp + m.wifeExp + m.recurring
    + (m.pl > 0 ? c.plEMI : 0)
    + (m.ch > 0 ? c.chEMI + c.chPrepay : 0)
    + (goalEMIs || 0);
}
function recurringDueItems(c, idx){
  return c.recurring.filter(rp => rp.enabled && isDue(rp, idx))
                    .map(rp => ({ item:rp, amount:dueAmount(rp, idx, c.expInflation) }));
}
function goalEMIsDue(m, c, sim){
  let total = 0;
  for (const g of c.goals){
    if (!g.enabled) continue;
    if ((m.goalLoan[g.id] || 0) > 0) total += sim.goalLoanEMI[g.id] || 0;
  }
  return total;
}
function actionText(plan, c){
  if (!plan) return "Your plan starts this month.";
  const parts = [];
  if (plan.actEF > 0) parts.push(`${fmt(plan.actEF)} → emergency fund`);
  if (plan.actPL > 0) parts.push(`${fmt(plan.actPL)} extra → personal loan`);
  let equityTotal = plan.actRet;
  for (const g of c.goals){
    if (!g.enabled) continue;
    const contrib = plan.goalContrib[g.id] || 0;
    if (contrib <= 0) continue;
    if (g.bucket === "liquid") parts.push(`${fmt(contrib)} → ${g.name} (liquid)`);
    else equityTotal += contrib;
  }
  if (equityTotal > 0){
    const us = equityTotal * c.usAlloc / 100;
    parts.push(`${fmt(us)} → US stocks, ${fmt(equityTotal - us)} → India stocks/MF`);
  }
  return parts.length ? parts.join(" · ") : "Nothing due this month.";
}

/* ---- one simulation per render, memoised on a serialised key ---- */
let _simCache = { key:null, plan:null, real:null };
function sims(){
  const key = JSON.stringify([STORE.config, STORE.actuals]);
  if (_simCache.key !== key){
    const c = STORE.config, a = STORE.actuals;
    _simCache = {
      key,
      plan: simulate(c, a.usValue, a.inValue),
      real: simulate(c, a.usValue, a.inValue, actualsOverride(a, c.goals))
    };
  }
  return _simCache;
}
/* =========================================================
   UI PRIMITIVES
   ========================================================= */
let _h = {}, _hn = 0;
function H(fn){ if (_hn > 6000){ _h = {}; _hn = 0; } const k = "h" + (_hn++); _h[k] = fn; return k; }
function RUN(k){ const f = _h[k]; if (f) f(); }
function RUNV(k, v){ const f = _h[k]; if (f) f(v); }
window.RUN = RUN; window.RUNV = RUNV;

const C = { income:"var(--income)", outgo:"var(--outgo)", wealth:"var(--wealth)",
            goals:"var(--goals)", safety:"var(--safety)", danger:"var(--danger)",
            t1:"var(--text)", t2:"var(--text2)", t3:"var(--text3)" };

function card(inner, opts){
  const o = opts || {};
  const cls = "card" + (o.tight ? " tight" : "") + (o.onTap ? " tap" : "");
  const tap = o.onTap ? ` onclick="RUN('${H(o.onTap)}')"` : "";
  return `<div class="${cls}"${tap}>${inner}</div>`;
}
function sect(text, symbol, tint){
  return `<div class="sect">${symbol ? `<span style="color:${tint||C.t2}">${icon(symbol)}</span>` : ""}${esc(text)}</div>`;
}
function row(label, value, o){
  o = o || {};
  const sym = o.symbol ? `<span style="color:${o.tint||C.t2};display:flex">${icon(o.symbol)}</span>` : "";
  return `<div class="row">${sym}<span class="lbl${o.em?" em":""}">${esc(label)}</span><span class="sp"></span>`
       + `<span class="val${o.em?" em":""}" style="color:${o.tint||C.t1}">${esc(value)}</span></div>`;
}
function tile(label, value, caption, symbol, tint){
  return `<div class="tile"><div class="k" style="color:${tint}">${icon(symbol,11)}<span style="color:var(--text2)">${esc(label)}</span></div>`
       + `<div class="v rnd" style="color:${tint}">${esc(value)}</div>`
       + (caption ? `<div class="c">${esc(caption)}</div>` : "") + `</div>`;
}
function pill(text, tint){ return `<span class="pill" style="color:${tint};background:color-mix(in srgb, ${tint} 16%, transparent)">${esc(text)}</span>`; }
function progress(p, tint){
  const w = Math.max(3, Math.min(100, (p||0) * 100));
  return `<div class="bar"><i style="width:${w}%;background:linear-gradient(90deg, ${tint}, color-mix(in srgb, ${tint} 65%, transparent))"></i></div>`;
}
function chev(){ return `<span class="chev">${icon("chevron.right")}</span>`; }
function divider(){ return `<div class="divider"></div>`; }
function note(t, dim){ return `<div class="note${dim?" t3":""}">${esc(t).replace(/\n/g,"<br>")}</div>`; }

function splitBar(segs){ // [label, value, color, symbol]
  const total = Math.max(1, segs.reduce((t,s)=> t + s[1], 0));
  const bars = segs.map(s => `<i style="flex:${Math.max(0.02, s[1]/total)};background:${s[2]};border-radius:4px;display:block;height:12px"></i>`).join("");
  const legend = segs.map(s => `<div class="row"><span style="color:${s[2]};display:flex">${icon(s[3])}</span>`
    + `<span class="lbl" style="font-size:12.5px">${esc(s[0])}</span><span class="sp"></span>`
    + `<span class="val">${esc(fmt(s[1]))}</span>`
    + `<span style="width:36px;text-align:right;font-size:11px;font-weight:600;color:var(--text3)">${Math.round(s[1]/total*100)}%</span></div>`).join("");
  return `<div style="display:flex;gap:3px">${bars}</div><div style="display:flex;flex-direction:column;gap:5px;margin-top:8px">${legend}</div>`;
}

/* ---- charts (hand-rolled SVG, no dependencies) ---- */
function lineChart(series, opts){
  const o = Object.assign({ height:150, rule:null, filled:false, legend:false }, opts||{});
  const W = 320, H = o.height, L = 34, R = 6, T = 8, B = 16;
  const all = series.flatMap(s => s.points);
  if (!all.length) return `<div class="note t3">No data</div>`;
  let xs = all.map(p=>p[0]), ys = all.map(p=>p[1]);
  if (o.rule !== null && o.rule !== undefined && isFinite(o.rule)) ys = ys.concat([o.rule]);
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(0, Math.min(...ys)), y1 = Math.max(...ys);
  if (x1 === x0) x1 = x0 + 1;
  if (y1 === y0) y1 = y0 + 1;
  y1 = y1 * 1.06;
  const X = v => L + (v - x0) / (x1 - x0) * (W - L - R);
  const Y = v => T + (1 - (v - y0) / (y1 - y0)) * (H - T - B);

  let grid = "", labels = "";
  for (let i=0;i<=3;i++){
    const v = y0 + (y1-y0)*i/3, y = Y(v);
    grid += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    labels += `<text x="${L-5}" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--text3)" text-anchor="end">${fmtAxis(v)}</text>`;
  }
  let xlab = "";
  for (let i=0;i<=3;i++){
    const v = x0 + (x1-x0)*i/3;
    xlab += `<text x="${X(v).toFixed(1)}" y="${H-3}" font-size="9" fill="var(--text3)" text-anchor="${i===0?"start":i===3?"end":"middle"}">${Math.floor(v/12)}</text>`;
  }
  let paths = "", defs = "";
  series.forEach((s, si) => {
    const pts = s.points.slice().sort((a,b)=>a[0]-b[0]);
    if (!pts.length) return;
    const d = pts.map((p,i)=> `${i?"L":"M"}${X(p[0]).toFixed(1)},${Y(p[1]).toFixed(1)}`).join(" ");
    if (o.filled && si === 0){
      const gid = "g"+Math.random().toString(36).slice(2,7);
      defs += `<linearGradient id="${gid}" x1="0" y1="0" x2="0" y2="1">`
           + `<stop offset="0%" stop-color="${s.color}" stop-opacity="0.30"/>`
           + `<stop offset="100%" stop-color="${s.color}" stop-opacity="0.02"/></linearGradient>`;
      paths += `<path d="${d} L${X(pts[pts.length-1][0]).toFixed(1)},${Y(y0).toFixed(1)} L${X(pts[0][0]).toFixed(1)},${Y(y0).toFixed(1)} Z" fill="url(#${gid})"/>`;
    }
    paths += `<path d="${d}" fill="none" stroke="${s.color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"${s.dashed?' stroke-dasharray="5 4" stroke-width="1.6"':""}/>`;
  });
  let ruleEl = "";
  if (o.rule !== null && o.rule !== undefined && isFinite(o.rule)){
    ruleEl = `<line x1="${L}" y1="${Y(o.rule).toFixed(1)}" x2="${W-R}" y2="${Y(o.rule).toFixed(1)}" stroke="var(--text3)" stroke-width="1" stroke-dasharray="4 4"/>`;
  }
  const legend = o.legend
    ? `<div class="legend">${series.map(s=>`<div><i style="background:${s.color}"></i>${esc(s.name||"")}</div>`).join("")}</div>` : "";
  return `<svg class="chart" viewBox="0 0 ${W} ${H}"><defs>${defs}</defs>${grid}${labels}${xlab}${ruleEl}${paths}</svg>${legend}`;
}

function barChart(items, opts){ // [{label, value, color}]
  const o = Object.assign({ height:150 }, opts||{});
  const W = 320, H = o.height, L = 34, R = 6, T = 8, B = 18;
  if (!items.length) return `<div class="note t3">No data</div>`;
  const max = Math.max(1, ...items.map(i=>i.value)) * 1.08;
  const iw = (W - L - R) / items.length;
  let grid = "", labels = "";
  for (let i=0;i<=3;i++){
    const v = max*i/3, y = T + (1 - v/max)*(H-T-B);
    grid += `<line x1="${L}" y1="${y.toFixed(1)}" x2="${W-R}" y2="${y.toFixed(1)}" stroke="var(--line)" stroke-width="1"/>`;
    labels += `<text x="${L-5}" y="${(y+3).toFixed(1)}" font-size="9" fill="var(--text3)" text-anchor="end">${fmtAxis(v)}</text>`;
  }
  const bars = items.map((it, i) => {
    const h = Math.max(0, it.value / max) * (H - T - B);
    const x = L + i*iw + iw*0.18, w = iw*0.64, y = H - B - h;
    return `<rect x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${w.toFixed(1)}" height="${Math.max(0.5,h).toFixed(1)}" rx="3" fill="${it.color}"/>`
         + (items.length <= 13 ? `<text x="${(x+w/2).toFixed(1)}" y="${H-5}" font-size="8" fill="var(--text3)" text-anchor="middle">${esc(it.label)}</text>` : "");
  }).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}">${grid}${labels}${bars}</svg>`;
}

/* ---- fields ---- */
function fld(label, get, set, o){
  o = o || {};
  const k = H(v => { const n = parseFloat(v); set(isFinite(n) ? n : 0); save(); render(); });
  const val = get();
  const shown = PRIVACY ? `<span class="sml" style="color:var(--text3)">✱✱✱✱</span>`
    : `<input type="number" inputmode="decimal" value="${val}" onchange="RUNV('${k}', this.value)">`
      + (o.suffix ? `<span class="sfx">${esc(o.suffix)}</span>` : "");
  const slider = (o.min !== undefined && !PRIVACY)
    ? `<input type="range" min="${o.min}" max="${o.max}" step="${o.step||1}" value="${Math.min(o.max, Math.max(o.min, val))}"
         oninput="this.closest('.fld').querySelector('input[type=number]').value=this.value"
         onchange="RUNV('${k}', this.value)">` : "";
  return `<div class="fld"><div class="top"><label>${esc(label)}</label>${shown}</div>${slider}</div>`;
}
function txt(label, get, set, o){
  o = o || {};
  const k = H(v => { set(v); save(); if (!o.quiet) render(); });
  return `<div class="fld"><div class="top">${label ? `<label>${esc(label)}</label>`:""}`
       + `<input type="text" class="${label?"":"wide"}" value="${esc(get())}" onchange="RUNV('${k}', this.value)"></div></div>`;
}
function toggle(label, get, set){
  const k = H(() => { set(!get()); save(); render(); });
  return `<div class="toggle" onclick="RUN('${k}')"><span>${esc(label)}</span><span class="sp"></span>`
       + `<span class="sw${get()?" on":""}"><i></i></span></div>`;
}
function segmented(options, current, onPick){
  return `<div class="seg">` + options.map((o,i) =>
    `<button class="${current===i?"on":""}" onclick="RUN('${H(()=>onPick(i))}')">${esc(o)}</button>`).join("") + `</div>`;
}
function symbolPicker(list, current, onPick){
  return `<div class="symrow">` + list.map(s =>
    `<button class="${current===s?"on":""}" onclick="RUN('${H(()=>onPick(s))}')">${icon(s)}</button>`).join("") + `</div>`;
}
function addButton(label, onTap){
  return `<div class="addbtn" onclick="RUN('${H(onTap)}')">${icon("plus.circle.fill",18)}<span>${esc(label)}</span></div>`;
}
function linkCard(symbol, title, subtitle, tint, onTap){
  return card(`<div class="row"><span style="color:${tint};display:flex">${icon(symbol)}</span>`
    + `<div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(title)}</div>`
    + (subtitle ? `<div class="note">${esc(subtitle)}</div>` : "") + `</div>${chev()}</div>`, { onTap });

const TABS = [
  { key:"today",    label:"Today",    symbol:"sun.max.fill" },
  { key:"flow",     label:"Flow",     symbol:"arrow.left.arrow.right" },
  { key:"goals",    label:"Goals",    symbol:"target" },

  { key:"insights", label:"Insights", symbol:"lightbulb.fill" }
];
let TAB = 0;
let STACK = [];          // pushed detail screens: {view, props}
const SEGSTATE = { flow:0, wealth:0 };

function go(view, props){ STACK.push({ view, props: props||{} }); render(); window.scrollTo(0,0); }
function back(){ STACK.pop(); render(); }
function setTab(i){ TAB = i; STACK = []; render(); }

const VIEWS = {};   // name -> fn(props) => {title, body, right?}

function render(){
  if (!STORE.onboarded){ renderOnboarding(); return; }
  const app = document.getElementById("screen");
  const nav = document.getElementById("nav");
  const top = STACK.length ? STACK[STACK.length-1] : { view: TABS[TAB].key, props:{} };
  const fn = VIEWS[top.view];
  let out;
  try { out = fn ? fn(top.props) : { title:"?", body:`<div class="note">Missing view: ${esc(top.view)}</div>` }; }
  catch(err){
    console.error(err);
    out = { title:"Error", body: card(sect("Something went wrong","exclamationmark.triangle.fill",C.danger)
      + note(String(err && err.message || err))) };
  }
  const left = STACK.length
    ? `<button class="link" onclick="RUN('${H(back)}')">${icon("chevron.left",16)}Back</button>` : "";
  nav.innerHTML = `<div class="slot left">${left}</div><div class="title">${esc(out.title)}</div>`
                + `<div class="slot right">${out.right || ""}</div>`;
  app.innerHTML = `<div class="stack">${out.body}</div>`;
  app.scrollTop = STACK.length ? 0 : app.scrollTop;
  document.getElementById("tabbar").innerHTML = TABS.map((t,i) =>
    `<button class="${i===TAB && !STACK.length ? "on" : (i===TAB?"on":"")}" onclick="RUN('${H(()=>setTab(i))}')">`
    + `${icon(t.symbol,22)}<span>${t.label}</span></button>`).join("");
}

VIEWS.today = () => {
  const c = STORE.config, a = STORE.actuals;

  const bd = driftBreakdown(plan, c, a);

  const impacts = goalImpacts(s, realSim, c);
  const consequence = deviationSummary(drift, impacts);
  const inc = plan ? incomeOf(plan) : 0;
  const out = plan ? outgoOf(plan, c, goalEMIsDue(plan, c, s)) : 0;
  const driftTint = drift >= 0 ? C.income : C.goals;

  const lastUpd = a.lastUpdated ? new Date(a.lastUpdated) : null;
  const needsCheckIn = !lastUpd || lastUpd.getFullYear()*12 + lastUpd.getMonth() !== nowIdx();

  const sub = [
    streak > 0 ? `${streak}-month streak` : null,

  const retF = s.need > 0 ? s.retAssets / s.need * 100 : 100;

  const body = [
    card(
      `<div style="cursor:pointer" onclick="RUN('${H(()=>go("networth"))}')">`
      + `<div class="sect" style="margin-bottom:2px"><span style="color:${C.wealth}">${icon("chart.pie.fill")}</span>Net worth ${chev()}</div>`
      + `<div class="hero rnd" style="color:${C.wealth}">${esc(fmt(nw.net))}</div></div>`
      + `<div style="cursor:pointer;margin-top:4px" onclick="RUN('${H(()=>go("impact"))}')">`
      + `<div style="display:flex;align-items:center;gap:6px;color:${driftTint};font-size:13px;font-weight:500">`
      + icon(drift >= 0 ? "checkmark.circle.fill" : "exclamationmark.triangle.fill", 14)
      + `<span>${drift >= 0 ? fmt(drift) + " ahead of plan" : fmt(-drift) + " behind plan"}</span>${chev()}</div>`
      + `<div class="note" style="margin-top:4px">${esc(consequence)}</div></div>`, { tight:true }),

    `<div class="banner"><div class="k">${icon("bolt.fill",12)}THIS MONTH</div>`
    + `<div class="v">${esc(actionText(plan, c))}</div></div>`,

    `<div class="card tap" style="background:${needsCheckIn ? "color-mix(in srgb, var(--safety) 12%, var(--surface))" : "var(--surface)"}"

    + `<div class="row"><span style="color:${needsCheckIn?C.safety:C.income};display:flex">${icon("checkmark.circle.fill",20)}</span>`
    + `<div style="flex:1"><div style="font-size:14px;font-weight:600;color:${needsCheckIn?C.safety:C.t1}">`
    + `${needsCheckIn ? "Time for your monthly check-in" : "Check-in saved this month"}</div>`

    `<div class="grid2">`

    + tile("Money out", fmt(out), "expenses + EMIs", "arrow.up.circle.fill", C.outgo)
    + tile("Liquid assets", fmt(nw.liquid), "deployable today", "drop.fill", C.safety)
    + tile("Debt", fmt(nw.liabilities), "loans + card dues", "creditcard.fill", C.outgo)

    card(sect("Goals","target",C.goals)

          a.fdSavings >= (plan ? plan.efTarget : 1) ? C.income : C.goals, ()=>go("emergency"))

  return { title:"WealthPilot", body, right };

VIEWS.reorder = () => {
  const gs = STORE.config.goals;
  const move = (i, d) => {
    const j = i + d; if (j < 0 || j >= gs.length) return;
    const t = gs[i]; gs[i] = gs[j]; gs[j] = t; save(); render();
  };
  const body = card(sect("Funding priority","arrow.up.arrow.down",C.wealth)
    + gs.map((g,i) => `<div class="row" style="padding:4px 0">`
      + `<span style="color:${g.bucket==="liquid"?C.goals:C.income};display:flex">${icon(g.symbol)}</span>`
      + `<div style="flex:1"><div style="font-size:14px;font-weight:600">${esc(g.name)}</div>`
      + `<div class="note">${esc(fmt(g.monthly))}/mo · target ${esc(fmt(g.target))} by ${Math.round(g.targetYear)}</div></div>`
      + `<button style="padding:6px;opacity:${i===0?0.25:1}" onclick="RUN('${H(()=>move(i,-1))}')"><span style="display:inline-block;transform:rotate(-90deg)">${icon("chevron.right",16)}</span></button>`
      + `<button style="padding:6px;opacity:${i===gs.length-1?0.25:1}" onclick="RUN('${H(()=>move(i,1))}')"><span style="display:inline-block;transform:rotate(90deg)">${icon("chevron.right",16)}</span></button>`
      + `</div>`).join(""))

};

function cashFlowBody(){
  const c = STORE.config;
  const s = sims().plan;
  const plan = s.planNow();
  const next12 = s.states.filter(m => m.idx >= nowIdx()).slice(0, 12);
  let out = "";

  if (plan){
    const emis = goalEMIsDue(plan, c, s);
    out += card(
      sect("Money in","arrow.down.circle.fill",C.income)
      + row("Salary (take-home)", fmt(plan.th), {symbol:"briefcase.fill", tint:C.income})
      + (plan.agInc > 0 ? row("Second property (your share)", fmt(plan.agInc), {symbol:"building.2.fill", tint:C.income}) : "")
      + (plan.chRent > 0 ? row("Other monthly income", fmt(plan.chRent), {symbol:"house.fill", tint:C.income}) : "")
      + (plan.month === 0 ? row("Annual bonus", fmt(c.bonus*plan.th/c.income), {symbol:"gift.fill", tint:C.income}) : "")
      + divider() + row("Total in", fmt(incomeOf(plan)), {em:true})
      + `<div style="height:6px"></div>`
      + sect("Money out","arrow.up.circle.fill",C.outgo)
      + row("House rent + living", fmt(plan.exp), {symbol:"cart.fill", tint:C.outgo})
      + (plan.wifeExp > 0 ? row("Dependants' expenses", fmt(plan.wifeExp), {symbol:"person.fill", tint:C.outgo}) : "")
      + recurringDueItems(c, plan.idx).map(e => row(e.item.name, fmt(e.amount), {symbol:e.item.symbol, tint:C.outgo})).join("")
      + (plan.pl > 0 ? row("Personal loan EMI", fmt(c.plEMI), {symbol:"creditcard.fill", tint:C.outgo}) : "")
      + (plan.ch > 0 ? row("Home loan EMI", fmt(c.chEMI + c.chPrepay), {symbol:"house.fill", tint:C.outgo}) : "")
      + c.goals.filter(g => (plan.goalLoan[g.id]||0) > 0)
          .map(g => row(g.name + " loan EMI", fmt(s.goalLoanEMI[g.id]||0), {symbol:g.symbol, tint:C.outgo})).join("")
      + divider() + row("Total out", fmt(outgoOf(plan, c, emis)), {em:true})
      + `<div class="row" style="padding-top:4px"><span class="sect" style="margin:0">Net → invested</span><span class="sp"></span>`
      + `<span class="big rnd" style="color:${C.income}">${esc(fmt(incomeOf(plan) - outgoOf(plan, c, emis)))}</span></div>`);
  }

  out += card(sect("The widening gap — 10 years","chart.line.uptrend.xyaxis",C.wealth)
    + lineChart([
        { name:"Income", points: pts(s.yearly, m => incomeOf(m)), color:C.income },
        { name:"Outgo",  points: pts(s.yearly, m => outgoOf(m, c, goalEMIsDue(m, c, s))), color:C.outgo }
      ], { height:170, legend:true })
    + note(`Income compounds at ~10%+/yr (hikes plus rents); outgo at ~${Math.round(c.expInflation)}%. Everything between the lines becomes wealth.`));

  out += card(sect("Next 12 months","calendar",C.wealth)
    + next12.map(m => {
        const i = incomeOf(m), o = outgoOf(m, c, goalEMIsDue(m, c, s));
        return `<div class="row" style="padding:3px 0"><span style="width:74px;font-size:12px;font-weight:600">${monthName(m.idx)}</span>`
          + `<div style="flex:1"><div style="font-size:11px;color:${C.income}">${esc(fmt(i))}</div>`
          + `<div style="font-size:11px;color:${C.outgo}">${esc(fmt(o))}</div></div>`
          + `<span class="sml" style="color:${C.income}">+${esc(fmt(i-o))}</span></div>`;
      }).join(""));

  out += linkCard("list.bullet.rectangle", "Where every rupee goes, month by month", "", C.wealth, ()=>go("allocation"));
  return out;
}

function recurringBody(){
  const c = STORE.config;
  const active = c.recurring.filter(r => r.enabled);
  const py = active.reduce((t,r)=> t + perYear(r), 0);
  const pm = py / 12;
  const months = [];
  for (let i = nowIdx(); i < nowIdx() + 12; i++){
    const items = recurringDueItems(c, i);
    months.push({ idx:i, total: items.reduce((t,x)=> t + x.amount, 0), items });
  }
  const heaviest = months.reduce((a,b)=> b.total > (a ? a.total : -1) ? b : a, null);

  let out = card(sect("Committed each year","calendar.badge.clock",C.outgo)
    + `<div class="hero rnd" style="color:${C.outgo}">${esc(fmt(py))}</div>`
    + note(`That's ${fmt(pm)} a month on average — money that leaves whether or not you budget for it.`)
    + (heaviest && heaviest.total > 0
        ? row("Heaviest month ahead", `${monthName(heaviest.idx)} · ${fmt(heaviest.total)}`,
              {symbol:"exclamationmark.triangle.fill", tint:C.goals}) : ""), {tight:true});

  out += card(sect("Next 12 months","calendar",C.wealth)
    + barChart(months.map(m => ({ label:shortMonth(m.idx), value:m.total,
        color: m.total >= pm*2 ? C.outgo : C.wealth })), { height:150 })
    + months.filter(m => m.total > 0).map(m =>
        `<div class="inset"><div class="row"><span style="font-size:13px;font-weight:700">${monthName(m.idx)}</span>`
        + `<span class="sp"></span><span class="sml" style="color:${m.total >= pm*2 ? C.outgo : C.t1}">${esc(fmt(m.total))}</span></div>`
        + m.items.map(e => row(e.item.name, fmt(e.amount), {symbol:e.item.symbol})).join("") + `</div>`).join(""));

  out += card(sect("Your commitments","list.bullet",C.goals)
    + (c.recurring.length ? "" : note("Nothing added yet. Insurance premiums, school fees, property tax, annual subscriptions — anything that isn't a monthly bill."))
    + c.recurring.map(rp =>
        `<div class="row" style="cursor:pointer;padding:2px 0" onclick="RUN('${H(()=>editRecurring(rp, false))}')">`
        + `<span style="color:${rp.enabled?C.goals:C.t2};display:flex">${icon(rp.symbol)}</span>`
        + `<div style="flex:1"><div style="font-size:13px;font-weight:600;color:${rp.enabled?C.t1:C.t2}">${esc(rp.name)}</div>`
        + `<div class="note">${esc(fmt(rp.amount))} · ${FREQ[rp.frequency].label} · ${esc(fmt(perYear(rp)))}/yr</div></div>${chev()}</div>`).join(""));

  out += addButton("Add a payment", ()=>editRecurring(newRecurring(), true));
  out += card(sect("Careful not to double-count","exclamationmark.triangle.fill",C.goals)
    + note(`These are subtracted on top of your monthly living expenses (currently ${fmt(c.livingExp)}). If some of them are already inside that figure, lower it in Settings by about ${fmt(pm)} so the plan doesn't charge you twice.\n\nThe emergency fund target also grows to cover the monthly average, since a job loss doesn't pause your premiums.`), {tight:true});
  return out;
}

function cardsBody(){
  const guide = [
    ["Food delivery & groceries","Your best food card","often 5–10% back","bag.fill"],
    ["Online shopping","Card tied to that retailer","5% is typical","cart.fill"],
    ["Flights & hotels","Card with a travel portal","points are worth most here","airplane"],
    ["Utilities & small bills","Whichever card has a milestone open","use them to close a target","bolt.fill"],
    ["Dining out","Your best dining card","base rate plus perks","fork.knife"],
    ["Fuel","Card with a surcharge waiver","the waiver beats the points","fuelpump.fill"],
    ["Everything else","Your best base-rate card","this is your home-base card","creditcard.fill"]
  ];
  let out = card(sect("Reward points held","star.circle.fill",C.goals)
    + `<div class="hero rnd" style="color:${C.goals}">${esc(fmt(pointsValue()))}</div>`
    + note("Across all cards, valued at what you would realistically get for them. Points are usually worth about twice as much booked as flights or hotels as they are taken in cashback or merchandise — set each card's point value to the redemption you would actually use."), {tight:true});

  out += card(sect("Which card for what","wand.and.stars",C.goals)
    + guide.map(g => `<div class="row"><span style="color:${C.wealth};display:flex">${icon(g[3])}</span>`
      + `<span class="lbl" style="font-size:12.5px">${esc(g[0])}</span><span class="sp"></span>`
      + `<div style="text-align:right"><div style="font-size:12px;font-weight:600">${esc(g[1])}</div>`
      + `<div style="font-size:10.5px;color:var(--text2)">${esc(g[2])}</div></div></div>`).join("")
    + note("Pick one home-base card for everything ordinary, and only reach for a specialist card inside its bonus category or while its monthly cap is unfilled."));

  out += STORE.cards.map(cd => {
    const ms = cd.milestones.map(m => {
      const hit = m.progress >= m.target;
      const left = Math.max(0, m.target - m.progress);
      return `<div class="inset">`
        + `<div class="row"><span style="font-size:12px;font-weight:600;flex:1">${esc(m.title)}</span>`
        + pill(m.deadline || m.period, hit ? C.income : C.goals)
        + `<button onclick="RUN('${H(()=>{ cd.milestones = cd.milestones.filter(x=>x.id!==m.id); save(); render(); })}')" style="color:var(--text3);display:flex">${icon("minus.circle.fill",14)}</button></div>`
        + fld("Target", ()=>m.target, v=>m.target=v, {min:0,max:2000000,step:5000})
        + progress(m.progress / Math.max(1, m.target), hit ? C.income : C.goals)
        + `<div class="row"><span style="font-size:11px;color:${hit?C.income:C.t2}">`
        + esc(hit ? `${m.reward} earned` : `${m.target < 100 ? Math.round(left) : fmt(left)} to go → ${m.reward}`) + `</span>`
        + `<span class="sp"></span>` + (m.valueINR > 0 && !hit
            ? `<span style="font-size:10.5px;font-weight:600;color:${C.goals}">worth ~${esc(fmt(m.valueINR))}</span>` : "") + `</div>`
        + (!hit && left > 0 && m.valueINR > 0
            ? `<div class="note t3">Marginal return on the remaining spend: ${(m.valueINR/left*100).toFixed(1)}%</div>` : "")
        + fld("Progress", ()=>m.progress, v=>m.progress=v, {min:0,max:Math.max(10,m.target*1.2),step:m.target<100?1:5000})
        + `</div>`;
    }).join("");
    return card(
      `<div class="row">${txt("", ()=>cd.name, v=>cd.name=v)}`
      + (cd.points > 0 ? pill(Math.round(cd.points) + " pts", C.goals) : "")
      + `<button onclick="RUN('${H(()=>{ cd.milestones.push({id:uid(),title:"New milestone",target:100000,progress:0,period:"monthly",reward:"Reward",deadline:"",valueINR:0}); save(); render(); })}')" style="color:var(--text2);display:flex">${icon("plus.circle.fill",18)}</button>`
      + `<button onclick="RUN('${H(()=>{ if(confirm("Delete this card?")){ STORE.cards = STORE.cards.filter(x=>x.id!==cd.id); save(); render(); } })}')" style="color:var(--text3);display:flex">${icon("trash",16)}</button></div>`
      + note(cd.baseReward)
      + (cd.points > 0 ? row("Points worth about", fmt(cd.points*cd.pointValue), {symbol:"star.fill", tint:C.goals})
                       + fld("Points balance", ()=>cd.points, v=>cd.points=v, {min:0,max:200000,step:500}) : "")
      + fld("Statement due", ()=>cd.due, v=>cd.due=v, {min:0,max:300000,step:1000})
      + ms + note(cd.strategy));
  }).join("");

  out += addButton("Add a card", ()=>{ STORE.cards.push({id:uid(),name:"New card",emoji:"",baseReward:"Reward rate",strategy:"When to use it",due:0,points:0,pointValue:1,milestones:[]}); save(); render(); });
  out += card(sect("Ground rules","exclamationmark.triangle.fill",C.goals)
    + note("Chase a milestone only with spending you'd do anyway. A bonus worth a few thousand is never worth manufacturing lakhs of spend to reach — the marginal-return line above tells you when it stops being worth it.\n\nMost issuers exclude rent, fuel, wallet loads and EMIs from rewards, and often from milestone progress too; check your own terms before relying on them. Reward rules change often, so everything here is editable.\n\nAnd the rule that beats every optimisation: always pay in full. One month of revolving interest erases a year of rewards."), {tight:true});
  return out;
}

function loanCard(o){
  return card(
    `<div class="row"><span class="avatar sm" style="background:color-mix(in srgb, ${o.tint} 15%, transparent);color:${o.tint}">${icon(o.symbol,15)}</span>`
    + `<div style="flex:1"><div style="font-size:15px;font-weight:600">${esc(o.title)}</div>`
    + `<div class="num rnd" style="color:${o.tint}">${esc(fmt(o.balance))}</div></div>`
    + pill(o.closes !== null && o.closes !== undefined ? "closes " + monthName(o.closes) : "open", o.tint) + `</div>`
    + o.rows.map(r => row(r[0], r[1])).join("")
    + row("Interest till close", fmt(o.interest))
    + note(o.note)
    + (o.schedule && o.schedule.length
        ? `<details><summary style="font-size:12px;font-weight:600;cursor:pointer;color:var(--wealth)">Payoff schedule</summary>`
          + `<div style="display:flex;flex-direction:column;gap:6px;padding-top:8px">`
          + o.schedule.slice(0,24).map(r => row(r[0], r[1])).join("") + `</div></details>` : ""));
}

function loansBody(){
  const c = STORE.config;
  const s = sims().plan;
  const plan = s.planNow();
  let out = card(sect("All balances","chart.line.downtrend.xyaxis",C.wealth)
    + lineChart([
        { name:"Personal", points: pts(s.yearly, m=>m.pl), color:C.outgo },
        { name:"Home loan", points: pts(s.yearly, m=>m.ch), color:C.goals },
        { name:"Second property", points: pts(s.yearly, m=>m.ag), color:C.wealth }
      ], { height:190, legend:true }));

  if (hasPL()) out += loanCard({ title:"Personal loan", symbol:"creditcard.fill", tint:C.outgo,
    balance:STORE.actuals.plOutstanding, closes:s.plDone, interest:s.intPL,
    rows:[["Rate", c.plRate.toFixed(1)+"%"], ["EMI", fmt(c.plEMI)+" + surplus"]],
    note:"Your entire surplus blitzes this once the emergency fund is full.",
    schedule: s.states.filter(m=>m.actPL>0).map(m => [monthName(m.idx), `pay ${fmt(m.actPL + c.plEMI)} → ${fmt(m.pl)}`]) });

  if (c.chBal > 0) out += loanCard({ title:"Home loan", symbol:"house.fill", tint:C.goals,
    balance: plan ? plan.ch : c.chBal, closes:s.chDone, interest:s.intCH,
    rows:[["Rate", c.chRate.toFixed(1)+"%"], ["EMI", fmt(c.chEMI + c.chPrepay)]],
    note:"Serviced from salary each month, alongside everything else.",
    schedule: s.states.filter(m=>m.month===0 && m.ch>0).map(m => [String(m.year), fmt(m.ch)]) });

  if (c.chBal > 0) out += card(sect("What if you prepay the home loan?","slider.horizontal.3",C.goals)
    + fld("Extra prepay per month", ()=>c.chPrepay, v=>c.chPrepay=v, {min:0,max:100000,step:5000})
    + row("Closes", monthName(s.chDone)) + row("Total interest", fmt(s.intCH)));

  if (c.spEnabled && c.spBal > 0) out += loanCard({ title:"Second property loan", symbol:"building.2.fill", tint:C.wealth,
    balance: plan ? plan.ag : c.spBal, closes:s.agDone, interest:s.intAG,
    rows:[["Rate", c.spRate.toFixed(1)+"%"], ["EMI + prepay", fmt(c.spEMI)+" + "+fmt(c.spPrepay)]],
    note:"Serviced by that property's own rental income rather than your personal surplus, so your share of the rent rises once it closes.",
    schedule: s.states.filter(m=>m.month===0 && m.ag>0).map(m => [String(m.year), fmt(m.ag)]) });

  const financedGoals = c.goals.filter(g => g.enabled && financed(g) > 0);
  out += financedGoals.map(g => loanCard({
    title: g.name + " loan", symbol:g.symbol, tint:C.income,
    balance: plan ? (plan.goalLoan[g.id]||0) : 0,
    closes: s.goalLoanClosed[g.id], interest: s.goalLoanInterest[g.id] || 0,
    rows:[["Starts when bought", monthName(s.goalFunded[g.id])],
          ["Loan amount", `${fmt(financed(g))} @ ${g.loanRate.toFixed(1)}%`],
          ["EMI", `${fmt(s.goalLoanEMI[g.id]||0)} × ${Math.round(g.loanYears)}y`]],
    note:`You save the ${Math.round(g.downPct)}% upfront share and finance the rest — worth it while your investments out-earn the loan. Change the split in the goal itself.`,
    schedule: s.states.filter(m=>m.month===0 && (m.goalLoan[g.id]||0)>0).map(m => [String(m.year), fmt(m.goalLoan[g.id]||0)])
  })).join("");

  if (!financedGoals.length){
    out += card(sect("No goal loans","checkmark.circle.fill",C.income)
      + note("None of your goals are part-financed. Set a goal's upfront share below 100% to model buying it with a loan."), {tight:true});
  }
  if (!hasPL() && c.chBal <= 0 && !(c.spEnabled && c.spBal > 0) && !financedGoals.length){
    out = card(sect("Debt free","checkmark.seal.fill",C.income)
      + note("You have no loans recorded, so there's nothing to amortise here. Add balances under Settings → Loans if that changes, and this tab will fill in with payoff dates and total interest."), {tight:true});
  }
  return out;
}

VIEWS.allocation = () => {

    + row("Investable surplus", fmt(m.surplus), {em:true}) + divider()

    + row("EPF", fmt(a.epf), {symbol:"building.columns.fill", tint:C.wealth})

    + row("Second property share", fmt(a.secondProperty), {symbol:"building.2.fill", tint:C.goals})

function projectionsBody(){
  const c = STORE.config, a = STORE.actuals;
  const s = sims().plan;
  const plan = s.planNow();
  const atR = s.atRetire;
  let eqC = plan ? plan.actRet : 0;
  if (plan) c.goals.filter(g => g.enabled && g.bucket === "equity").forEach(g => eqC += plan.goalContrib[g.id] || 0);
  const usC = eqC * c.usAlloc / 100;

  const stream = (o) => card(
    `<div class="row"><span class="avatar sm" style="background:color-mix(in srgb, ${o.tint} 15%, transparent);color:${o.tint}">${icon(o.symbol,15)}</span>`
    + `<div><div style="font-size:14px;font-weight:600">${esc(o.title)}</div>`
    + `<div class="num rnd" style="color:${o.tint}">${esc(o.now)}</div></div></div>`
    + (o.extra ? row(o.extra[0], o.extra[1], {em:true}) : "")
    + lineChart([{ name:o.title, points:o.points, color:o.tint }], { height:120, filled:true })
    + row(o.atLabel, o.atValue) + note(o.note));

  let out = "";
  out += stream({ title:"Salary", symbol:"briefcase.fill", tint:C.income,
    now: fmt(plan ? plan.th : c.income) + "/mo", atLabel:`At ${Math.round(c.retireYear)}`, atValue: fmt(atR.th)+"/mo",
    points: pts(s.yearly, m=>m.th),
    note:`+${Math.round(c.hikeAnnual)}%/yr, with +${Math.round(c.hikeSwitch)}% every ${Math.round(c.hikeSwitchEvery)} years to reflect a job switch. Bonus grows with salary and is invested each January.` });

  out += stream({ title:"Expenses", symbol:"cart.fill", tint:C.outgo,
    now: fmt((plan?plan.exp:0) + (plan?plan.wifeExp:0)) + "/mo",
    atLabel:`Household at ${Math.round(c.retireYear)}`, atValue: fmt(s.expThen)+"/mo",
    points: pts(s.yearly, m=>m.exp + m.wifeExp),
    note:`Rent, living costs and dependants' expenses, all inflating at ${Math.round(c.expInflation)}%/yr.` });

  out += stream({ title:"US stocks", symbol:"globe.americas.fill", tint:C.wealth,
    now: fmt(plan ? plan.usV : a.usValue), atLabel:`At ${Math.round(c.retireYear)}`, atValue: fmt(atR.usV),
    points: pts(s.yearly, m=>m.usV), extra:["Invest this month", fmt(usC)],
    note:`Gets ${Math.round(c.usAlloc)}% of every equity contribution. Watch LRS/TCS above ₹7L a year.` });

  out += stream({ title:"India stocks + MF", symbol:"globe.asia.australia.fill", tint:C.goals,
    now: fmt(plan ? plan.inV : a.inValue), atLabel:`At ${Math.round(c.retireYear)}`, atValue: fmt(atR.inV),
    points: pts(s.yearly, m=>m.inV), extra:["Invest this month", fmt(eqC - usC)],
    note:`Gets ${Math.round(100 - c.usAlloc)}% of every equity contribution.` });

  out += stream({ title:"EPF", symbol:"building.columns.fill", tint:C.wealth,
    now: fmt(plan ? plan.epf : c.epfBal), atLabel:`At ${Math.round(c.retireYear)}`, atValue: fmt(atR.epf),
    points: pts(s.yearly, m=>m.epf),
    note:`Contribution scales with your salary; compounding at ${c.epfRate.toFixed(2)}%.` });

  out += stream({ title:"NPS", symbol:"shield.lefthalf.filled", tint:C.safety,
    now: fmt(plan ? plan.nps : c.npsBal), atLabel:`At ${Math.round(c.retireYear)}`, atValue: fmt(atR.nps),
    points: pts(s.yearly, m=>m.nps),
    note:"Contribution scales with salary. Mostly locked until 60, with 40% going to an annuity." });

  out += linkCard("slider.horizontal.3", "Adjust returns and assumptions", "", C.wealth, ()=>go("settings"));
  return out;
}

function historyBody(){
  const h = [...STORE.history].sort((a,b)=> new Date(a.date) - new Date(b.date));
  const t = d => new Date(d).getFullYear()*12 + new Date(d).getMonth();
  let out = card(sect("Track record","flame.fill",C.goals)
    + row("Months tracked", String(h.length))
    + row("Check-in streak", String(checkInStreak()))
    + row("On-plan streak", String(onPlanStreak()))
    + (h.length >= 2 ? row("Net worth change", "+" + fmt(h[h.length-1].netWorth - h[0].netWorth), {em:true}) : ""));

  if (h.length >= 2){
    out += card(sect("Net worth — actual","chart.line.uptrend.xyaxis",C.wealth)
      + lineChart([{ name:"Net worth", points: h.map(s=>[t(s.date), s.netWorth]), color:C.wealth }], {height:170, filled:true}));
    out += card(sect("Invested — actual vs plan","target",C.income)
      + lineChart([
          { name:"Actual", points: h.map(s=>[t(s.date), snapLiquid(s)]), color:C.income },
          { name:"Plan",   points: h.map(s=>[t(s.date), s.planned]), color:C.t3, dashed:true }
        ], {height:170, legend:true})
      + note("Green above the dashed line means you're ahead of plan. This gap is your discipline, made visible."));
  } else {
    out += card(sect("No history yet","clock.arrow.circlepath",C.t2)
      + note("Charts appear after your second monthly check-in. Save one each month — that's the whole ritual."), {tight:true});
  }

  out += [...STORE.history].sort((a,b)=> new Date(b.date) - new Date(a.date)).map(sn => {
    const d = new Date(sn.date);
    return card(`<div class="row"><span style="font-size:14px;font-weight:700">${MONTHS[d.getMonth()]} ${d.getFullYear()}</span>`
      + `<span class="sp"></span>${pill(snapDrift(sn) >= 0 ? "on plan" : "behind " + fmt(-snapDrift(sn)), snapDrift(sn) >= 0 ? C.income : C.goals)}`
      + `<button onclick="RUN('${H(()=>{ STORE.history = STORE.history.filter(x=>x.id!==sn.id); save(); render(); })}')" style="color:var(--text3);display:flex;margin-left:8px">${icon("trash",15)}</button></div>`
      + row("Net worth", fmt(sn.netWorth), {em:true})
      + row("Invested", fmt(snapLiquid(sn)) + " · plan " + fmt(sn.planned))
      + row("US / India", fmt(sn.us) + " · " + fmt(sn.ind))
      + row("Loan outstanding", fmt(sn.loanOutstanding)), {tight:true});
  }).join("");
  return out;
}

VIEWS.insights = () => {
  const c = STORE.config, a = STORE.actuals;
  const sim = sims().plan;
  const plan = sim.planNow();
  const th = plan ? plan.th : c.income;
  const exp = (plan ? plan.exp : c.rentExp + c.livingExp) + (plan ? plan.wifeExp : c.depExp);
  const passive = (plan ? plan.agInc : 0) + (plan ? plan.chRent : c.otherIncome);
  const emis = (a.plOutstanding > 0 ? c.plEMI : 0) + (c.chBal > 0 ? c.chEMI : 0);
  const burn = exp + emis;
  const netBurn = Math.max(1, burn - passive);
  const n = netWorthOf(a, c, STORE.cards);
  const runway = n.liquid / netBurn;
  const target = c.efMonths * netBurn;
  const savingsRate = (plan ? plan.surplus : 0) / Math.max(1, th) * 100;
  const emiBurden = emis / Math.max(1, th) * 100;
  const reConc = (n.net > 0 ? n.hard / n.net : 0) * 100;
  const funded = sim.need > 0 ? sim.retAssets / sim.need * 100 : 100;
  const runwayTint = runway >= 6 ? C.income : runway >= 3 ? C.goals : C.danger;

  const metric = (label, value, good, suffix) =>
    `<div class="row"><span style="color:${good?C.income:C.goals};display:flex">${icon(good?"checkmark.circle.fill":"exclamationmark.triangle.fill",14)}</span>`
    + `<span class="lbl">${esc(label)}</span><span class="sp"></span>`
    + `<span class="val">${value.toFixed(0)}${esc(suffix)}</span></div>`;

  const list = (title, tint, symbol, items) => card(sect(title, symbol, tint)
    + items.map(i => `<div class="row" style="align-items:flex-start">`
      + `<span style="color:${i.good?C.income:C.goals};display:flex;padding-top:2px">${icon(i.good?"checkmark.circle.fill":"exclamationmark.triangle.fill",14)}</span>`
      + `<div style="flex:1"><div style="font-size:13px;font-weight:600">${esc(i.title)}</div>`
      + `<div class="note">${esc(i.detail)}</div></div></div>`).join(""));

  const multiple = a.termSelf / Math.max(1, th*12);
  const recommended = 10*th*12 + a.plOutstanding + c.chBal;

  const strengths = [];
  if (savingsRate >= 15) strengths.push({good:true, title:`Strong savings rate (${savingsRate.toFixed(0)}%)`,
    detail:"You out-save most households, and it climbs further as loans close and any rental income starts."});
  if (c.spEnabled) strengths.push({good:true, title:"A second income leg is coming",
    detail:`Your rental share starts in ${Math.round(c.spRentStartYear)} and grows ${Math.round(c.spGrowthPct)}% every ${Math.round(c.spGrowthEvery)} years — income that doesn't depend on your job.`});
  if (emiBurden < 30) strengths.push({good:true, title:`Healthy EMI burden (${emiBurden.toFixed(0)}%)`,
    detail:"Comfortably under the 40% danger zone, and shrinking as loans close."});
  if (funded >= 100) strengths.push({good:true, title:"Retirement target is reachable",
    detail:"Projected assets cover the corpus needed — conditional on the return assumptions holding and disciplined monthly investing."});
  if (n.hard > 0) strengths.push({good:true, title:"You own hard assets",
    detail:"Property and vehicles are illiquid, but they hold value, can produce rent, and can be borrowed against if you ever need flexibility."});

  const watch = [];
  if (runway < 6) watch.push({good:false, title:`Runway is only ${runway.toFixed(1)} months`,
    detail:`The plan handles this first, but until the fund is built you're exposed. ${fmt(Math.max(0, target - n.liquid))} to go.`});
  if (reConc > 60) watch.push({good:false, title:`${reConc.toFixed(0)}% of net worth is real estate`,
    detail:"Property is illiquid and concentrated — it can't be sold quickly or in parts, so it can't rescue a cash crunch."});
  if (n.stocksPct < 10) watch.push({good:false, title:"Stocks are far from your 60% goal",
    detail:`Currently ${n.stocksPct.toFixed(1)}%. Until this shifts, your wealth grows at real-estate pace rather than equity pace.`});
  if (passive < exp*0.2) watch.push({good:false, title:"Almost everything rests on your salary",
    detail:"With little passive income, a job loss stops the entire plan. Term cover and the emergency fund are the two things that blunt that."});
  if (c.spEnabled) watch.push({good:false, title:"The plan leans on the rental income arriving",
    detail:"Future rent and loan closure carry a lot of the retirement maths. Update those numbers as reality lands."});

  const body = [
    card(sect("If you lose your job tomorrow","lifepreserver.fill",runwayTint)
      + `<div style="display:flex;align-items:baseline;gap:6px"><span class="hero rnd" style="color:${runwayTint}">${runway.toFixed(1)}</span>`
      + `<span style="font-size:13px;color:var(--text2)">months of runway</span></div>`
      + progress(runway/6, runwayTint)
      + row("Liquid funds", fmt(n.liquid), {symbol:"drop.fill", tint:C.safety})
      + row("Monthly outgo", fmt(burn), {symbol:"arrow.up.circle.fill", tint:C.outgo})
      + row("Offset by rentals", "− " + fmt(passive), {symbol:"arrow.down.circle.fill", tint:C.income})
      + row("Net burn", fmt(netBurn), {em:true})
      + row(`Gap to ${Math.round(c.efMonths)}-month target`, fmt(Math.max(0, target - n.liquid)))
      + note(`The plan builds this buffer first — ${Math.round(c.efSplit)}% of surplus plus the January bonus, funded by ${monthName(sim.efDone)}. In India, EPF also becomes partially withdrawable after 1–2 months of unemployment.`)),

    card(sect("Insurance cover","shield.lefthalf.filled",C.safety)
      + row("Health — personal floater", fmt(a.healthPersonal), {symbol:"cross.case.fill", tint:C.safety})
      + row("Health — employer", fmt(a.healthEmployer), {symbol:"briefcase.fill"})
      + row("Term life — you", fmt(a.termSelf) + `  (${multiple.toFixed(1)}×)`, {symbol:"person.fill", tint: multiple < 10 ? C.goals : C.income})
      + row("Term life — partner", fmt(a.termSpouse), {symbol:"person.fill"})
      + note(a.healthPersonal >= 2000000
          ? "Health cover is strong for a family of three — and it's the one that matters, since employer cover vanishes with the job."
          : "Personal health cover below ₹20L is thin for a family of three in a metro. Employer cover doesn't count — it disappears with the job.")
      + (multiple < 10 ? `<div class="note" style="color:${C.goals}">Term cover is only ${multiple.toFixed(1)}× your annual income. The guideline is 10–15× income plus liabilities ≈ ${esc(fmt(recommended))}. A top-up now is inexpensive and locks in today's health status.</div>` : "")),

    card(sect("Financial health","heart.text.square.fill",C.wealth)
      + metric("Savings rate", savingsRate, savingsRate >= 20, "% of take-home")
      + metric("EMI burden", emiBurden, emiBurden < 30, "% of take-home")
      + metric("Real-estate concentration", reConc, reConc < 60, "% of net worth")
      + metric("Stocks share", n.stocksPct, n.stocksPct >= 30, "% (goal 60%)")
      + metric("Passive income covers", passive/Math.max(1,exp)*100, passive/Math.max(1,exp) > 0.3, "% of expenses")
      + metric(`Retirement ${Math.round(c.retireYear)} funded`, funded, funded >= 100, "%")),

    list("Strengths", C.income, "checkmark.seal.fill", strengths),
    list("Watch-outs", C.goals, "exclamationmark.triangle.fill", watch)
  ].join("");
  return { title:"Insights", body };
};

    card(sect("The sum","function",C.t2)
      + row("Assets", fmt(n.assets), {tint:C.income})

VIEWS.impact = () => {
  const c = STORE.config, a = STORE.actuals;
  const { plan: planSim, real: realSim } = sims();
  const impacts = goalImpacts(planSim, realSim, c);
  const bd = driftBreakdown(planSim.planNow(), c, a);
  const drift = bd.drift, ahead = drift >= 0;
  const hurt = impacts.filter(i => i.worse && i.deltaText).length;

  const extra = VIEWS.impact._extra || 0;
  let catchImpacts = null;
  if (extra > 0){
    const cc = Object.assign({}, c, { extraSavings: c.extraSavings + extra });
    const catchSim = simulate(cc, a.usValue, a.inValue, actualsOverride(a, c.goals));
    catchImpacts = goalImpacts(planSim, catchSim, c);
  }
  const setExtra = v => { VIEWS.impact._extra = parseFloat(v)||0; render(); };

  const body = [
    card(sect(ahead ? "You're ahead" : "You're behind",
        ahead ? "arrow.up.right.circle.fill" : "arrow.down.right.circle.fill", ahead ? C.income : C.goals)
      + `<div class="hero rnd" style="color:${ahead?C.income:C.goals}">${esc(fmt(Math.abs(drift)))}</div>`
      + note(deviationSummary(drift, impacts)), {tight:true}),

    card(sect("Every goal, plan vs reality","arrow.left.arrow.right",C.wealth)
      + impacts.map(g => `<div class="inset">`
        + `<div class="row"><span style="color:${C.wealth};display:flex">${icon(g.symbol)}</span>`
        + `<span style="font-size:13px;font-weight:600">${esc(g.name)}</span><span class="sp"></span>`
        + (g.deltaText ? pill(g.deltaText, g.worse ? C.danger : C.income) : pill("unchanged", C.t2)) + `</div>`
        + `<div class="row"><span class="note t3">Plan: ${esc(g.planText)}</span><span class="sp"></span>`
        + `<span style="font-size:11.5px;font-weight:600;color:${!g.deltaText?C.t2:(g.worse?C.danger:C.income)}">Now: ${esc(g.realText)}</span></div></div>`).join("")),

    card(sect("What would fix it","slider.horizontal.3",C.income)
      + note(extra > 0 ? `Saving ${fmt(extra)} extra every month:` : "Drag to see what extra monthly saving would do.")
      + `<input type="range" min="0" max="100000" step="2500" value="${extra}" onchange="RUNV('${H(setExtra)}', this.value)">`
      + `<div class="row"><span class="note t3">₹0</span><span class="sp"></span>`
      + `<span class="num rnd" style="color:${C.income}">${esc(fmt(extra))}</span><span class="sp"></span><span class="note t3">₹1L</span></div>`
      + (catchImpacts ? divider()
          + catchImpacts.map(g => row(g.name, g.deltaText || "back on plan",
              {symbol:g.symbol, tint: !g.deltaText ? C.income : (g.worse ? C.goals : C.income)})).join("")
          + note("Compared against the original plan. “Back on plan” means the extra saving fully absorbs the deviation for that goal.")
          + `<div class="addbtn center" style="background:${C.income};color:#fff;justify-content:center" onclick="RUN('${H(()=>{ STORE.config.extraSavings += extra; VIEWS.impact._extra = 0; save(); render(); })}')">Commit ${esc(fmt(extra))}/month to the plan</div>`
        : "")),

    card(sect("Deviation alerts","bell.badge.fill",C.goals)
      + fld("Notify me when drift exceeds", ()=>c.driftAlert, v=>c.driftAlert=v, {min:0,max:200000,step:2500})
      + note(c.driftAlert > 0
          ? `When a check-in shows drift beyond ${fmt(c.driftAlert)}, the app flags which goal moved and by how much.`
          : "Alerts are off. Set a threshold above zero to be told when goals start slipping.")),

    c.extraSavings > 0 ? card(sect("Committed extra saving","checkmark.seal.fill",C.income)
      + fld("Extra per month", ()=>c.extraSavings, v=>c.extraSavings=v, {min:0,max:200000,step:2500})
      + note("This is added to every month's surplus across the whole app. Set it back to zero if it stops being realistic — an over-optimistic plan is worse than an honest one."), {tight:true}) : "",

    card(sect("How this is calculated","function",C.t2)
      + note(`Two simulations run side by side. The plan is your original trajectory from the month you started. Reality replays that same plan up to this month, then restarts from your actual balances — loan outstanding, emergency fund, equity, EPF and NPS — and projects forward. The difference between the two is what your deviation costs.\n\n${hurt === 0 ? "No goal has moved yet." : hurt + " goal" + (hurt === 1 ? " has" : "s have") + " moved."} Accuracy depends entirely on your last check-in being current.`), {tight:true})
  ].join("");
  return { title:"Impact of deviation", body };
};

VIEWS.drift = () => {
  const c = STORE.config, a = STORE.actuals;
  const s = sims().plan;
  const plan = s.planNow();
  const bd = driftBreakdown(plan, c, a);
  const ahead = bd.drift >= 0;
  const monthlyBuild = plan ? plan.actEF + plan.goalContribTotal + plan.actRet : 0;

  const body = [
    card(sect(ahead ? "Ahead of plan" : "Behind plan",
        ahead ? "checkmark.circle.fill" : "exclamationmark.triangle.fill", ahead ? C.income : C.goals)
      + `<div class="hero rnd" style="color:${ahead?C.income:C.goals}">${esc(fmt(Math.abs(bd.drift)))}</div>`
      + note(`What you actually hold, minus what the plan expects you to have accumulated by ${monthName(plan ? plan.idx : null)}.`), {tight:true}),

    card(sect("The plan expects","target",C.wealth)
