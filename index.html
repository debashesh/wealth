      + (bd.commonFundAdj > 0 ? row("less expected windfall (not yours yet)", "− " + fmt(bd.commonFundAdj)) : "")
      + divider() + row("Planned total", fmt(bd.planned), {em:true})),

    card(sect("You actually hold","wallet.bifold.fill",C.income)
      + row("US stocks", fmt(bd.actUS), {symbol:"globe.americas.fill", tint:C.wealth})
      + row("India stocks + MF", fmt(bd.actIN), {symbol:"globe.asia.australia.fill", tint:C.goals})
      + row("Emergency fund (FD + savings)", fmt(bd.actEF), {symbol:"lifepreserver.fill", tint:C.safety})
      + row("Goal savings (liquid)", fmt(bd.actGoalsLiquid), {symbol:"target", tint:C.goals})
      + divider() + row("Actual total", fmt(bd.actual), {em:true})),

    card(sect("The sum","function",C.t2)
      + row("Actual", fmt(bd.actual)) + row("Planned", "− " + fmt(bd.planned)) + divider()
      + row("Drift", (ahead?"+":"") + fmt(bd.drift), {tint: ahead?C.income:C.goals, em:true})),

    card(sect("Why the loan isn't in this number","creditcard.fill",C.outgo)

      + note("Most of your surplus right now goes to loan prepayment, which reduces debt rather than building an asset — so it doesn't appear in the drift figure above. Both matter: drift tracks what you own, this tracks what you owe. Your net worth on the home screen already nets the two.")),

    linkCard("arrow.left.arrow.right", "What is this costing me?", "See how each goal date shifts", C.goals, ()=>go("impact")),

    card(sect(ahead ? "Keep it up" : "How to close the gap","arrow.right.circle.fill", ahead ? C.income : C.goals)
      + note(ahead
          ? "You're holding more than the plan requires. Nothing to fix — keep saving the check-in each month so the streak and history build up."
          : `The plan assumes you started investing the month you set it up. Until you actually begin, this gap grows by roughly ${fmt(monthlyBuild)} a month.\n\nTwo ways to close it: put ${fmt(Math.abs(bd.drift))} into your emergency fund to catch up in one go, or accept the later dates — every goal will re-date itself once you update your real balances at the next check-in.`), {tight:true})
  ].join("");
  return { title:"Drift explained", body };

    timelineCard("Month by month", s.states.filter(m=>m.actEF>0).map(m => [monthName(m.idx), `+${fmt(m.actEF)} → ${fmt(m.ef)}`])),
    explainCard(`This is funded before anything else. The target is ${Math.round(c.efMonths)} × (expenses + EMIs − rental income), so it shrinks as your rental income grows. Park it in a liquid fund or sweep-in FD — never equity.`)
  ].join("");
  return { title:"Emergency fund", body };
};

VIEWS.retirement = () => {
  const c = STORE.config;
  const s = sims().plan;
  const funded = s.need > 0 ? s.retAssets / s.need * 100 : 100;
  const body = [
    heroCard(Math.round(funded) + "%", `Funded for ${Math.round(c.retireYear)}`, "beach.umbrella.fill", C.wealth),
    factsCard([["Corpus needed", fmt(s.need)], ["Projected", fmt(s.retAssets)],
               ["— Equity bucket", fmt(s.atRetire.ret)], ["— EPF", fmt(s.atRetire.epf)], ["— NPS", fmt(s.atRetire.nps)],

    linkCard("sunset.fill", "See the 10 years after retirement", "", C.goals, ()=>go("postRet"))
  ].join("");

VIEWS.postRet = () => {
  const c = STORE.config;
  const s = sims().plan;
  const retYear = Math.round(c.retireYear);
  const rows = [];
  let corp = s.retAssets;
  for (let i=0;i<10;i++){
    const y = retYear + i;
    const exp = (c.rentExp + c.livingExp) * Math.pow(1 + c.expInflation/100, y - START_YEAR);
    const agOpen = s.agDone !== null ? (y*12 < s.agDone) : true;
    const rentNet = spRent(c, y, 0) * (1 - c.spMaint/100) - (agOpen ? c.spEMI : 0);
    const rent = Math.max(0, rentNet * c.spShare / 100);
    const draw = Math.max(0, exp - rent) * 12;
    corp = corp * (1 + c.postRetReturn/100) - draw;
    rows.push({ y, exp, rent, draw, corp });
  }
  const endCorpus = rows[rows.length-1].corp;
  const growing = endCorpus > s.retAssets;
  const depleted = rows.find(r => r.corp <= 0);

  const body = [
    card(sect("Verdict","sunset.fill",C.goals)
      + `<div class="big rnd" style="color:${depleted ? C.danger : growing ? C.income : C.goals}">`
      + esc(depleted ? `Corpus runs out in ${depleted.y}` : growing ? "Corpus grows while you spend it" : `Corpus lasts beyond ${retYear+10}`) + `</div>`
      + row(`Starting corpus (${retYear})`, fmt(s.retAssets)) + row("After 10 years", fmt(endCorpus)), {tight:true}),
    card(sect("Corpus over the decade","chart.bar.fill",C.wealth)
      + barChart(rows.map(r => ({ label:String(r.y).slice(2), value:Math.max(0,r.corp),
          color: r.corp > s.retAssets ? C.income : C.wealth })), {height:180})),
    card(sect("Post-retirement return","dial.medium",C.t2)
      + fld("Assumed return", ()=>c.postRetReturn, v=>c.postRetReturn=v, {min:5,max:14,step:0.5,suffix:"%"})
      + note("Lower than your accumulation-phase return — portfolios usually shift toward safety at retirement.")),
    rows.map(r => card(`<div style="font-size:15px;font-weight:700">${r.y}</div>`
      + row("Expenses", fmt(r.exp)+"/mo", {symbol:"arrow.up.circle.fill", tint:C.outgo})
      + row("Rental income", fmt(r.rent)+"/mo", {symbol:"arrow.down.circle.fill", tint:C.income})
      + row("Withdrawn from corpus", fmt(r.draw)+"/yr", {symbol:"minus.circle.fill"})
      + row("Corpus at year end", fmt(r.corp), {em:true}), {tight:true})).join(""),
    card(sect("Notes","info.circle",C.t2)
      + note("Rental income keeps growing while withdrawals shrink in real terms — that's why a corpus can grow even while you spend from it. Goal money is excluded here, since it's already spoken for. In India, NPS is mostly locked until 60 with 40% going to an annuity, while EPF is accessible at retirement."), {tight:true})
  ].join("");
  return { title:"After retirement", body };
};

VIEWS.goalDetail = (props) => {
  const c = STORE.config;
  const g = c.goals.find(x => x.id === props.id);
  if (!g) return { title:"Goal", body: card(sect("Goal deleted","trash",C.t2) + note("This goal is no longer in your plan."), {tight:true}) };
  const s = sims().plan;
  const plan = s.planNow();
  const tint = g.bucket === "liquid" ? C.goals : C.income;
  const val = plan ? (plan.goalVal[g.id] || 0) : 0;
  const projected = s.finalValue(g.id);
  const emi = s.goalLoanEMI[g.id] || 0;

  let expl = `${fmt(g.monthly)} a month`;
  if (g.stepUpPct > 0) expl += `, rising ${Math.round(g.stepUpPct)}% a year`;
  expl += g.afterDebtFree ? `, starting once the personal loan closes (${monthName(s.plDone)}).` : ", starting immediately.";
  expl += g.bucket === "liquid"
    ? " Held in a liquid fund or FD, because short-horizon money shouldn't ride market swings."
    : ` Invested in equity (${Math.round(c.usAlloc)}% US / ${Math.round(100-c.usAlloc)}% India).`;
  if (financed(g) > 0)
    expl += ` You save only the ${Math.round(g.downPct)}% upfront share (${fmt(fundedTarget(g))}) and finance ${fmt(financed(g))} at ${g.loanRate.toFixed(1)}% — worth it while your investments are expected to out-earn the loan.`;

  const body = [
    heroCard(fmt(g.target), `Target by ${Math.round(g.targetYear)}`, g.symbol, tint),
    factsCard([
      ["Must be saved", fmt(fundedTarget(g)) + (financed(g) > 0 ? ` (${Math.round(g.downPct)}% upfront)` : "")],
      ["Financed", financed(g) > 0 ? `${fmt(financed(g))} @ ${g.loanRate.toFixed(1)}%` : "none"],
      ["EMI once bought", emi > 0 ? `${fmt(emi)}/mo × ${Math.round(g.loanYears)}y` : "—"],
      ["Saved so far (plan)", fmt(val)], ["Your actual", fmt(g.actual)],
      ["Monthly", fmt(g.monthly) + (g.stepUpPct > 0 ? ` +${Math.round(g.stepUpPct)}%/yr` : "")],
      ["Held in", g.bucket === "liquid" ? "Liquid / FD" : "Equity"],
      ["Funded", monthName(s.goalFunded[g.id])], ["Projected at end", fmt(projected)]]),
    card(lineChart([{ name:g.name, points: pts(s.states.filter(m=>m.month%2===0), m => m.goalVal[g.id]||0), color:tint }],
      {height:150, filled:true, rule:fundedTarget(g)})),
    timelineCard("Contributions", s.states.filter(m => (m.goalContrib[g.id]||0) > 0)
      .map(m => [monthName(m.idx), `+${fmt(m.goalContrib[g.id])} → ${fmt(m.goalVal[g.id]||0)}`])),
    explainCard(expl),
    `<div class="addbtn" onclick="RUN('${H(()=>editGoal(g, false))}')">${icon("pencil",18)}<span>Edit this goal</span></div>`,
    `<div class="addbtn danger" onclick="RUN('${H(()=>{ if(confirm("Delete "+g.name+"?")){ STORE.config.goals = c.goals.filter(x=>x.id!==g.id); save(); back(); } })}')">${icon("trash",18)}<span>Delete this goal</span></div>`
  ].join("");
  return { title:g.name, body };
};

const GOAL_SYMBOLS = ["car.fill","house.fill","graduationcap.fill","airplane","heart.fill",
                      "briefcase.fill","gift.fill","camera.fill","building.2.fill","target"];
const PAY_SYMBOLS  = ["cross.case.fill","shield.lefthalf.filled","graduationcap.fill","car.fill",
                      "house.fill","building.columns.fill","tv.fill","wifi","creditcard.fill","calendar"];

function editGoal(original, isNew){
  const g = Object.assign({}, original);
  openSheet({
    title: isNew ? "New goal" : "Edit goal",
    body(){
      const yearsAway = Math.max(0, Math.round(g.targetYear) - new Date().getFullYear());
      const warn = yearsAway <= 3 && g.bucket === "equity"
        ? `⚠︎ This goal is only ${yearsAway} year${yearsAway===1?"":"s"} away. Equity can fall 30% in a bad year — liquid is usually the safer choice this close.` : "";
      return card(sect("What are you saving for?")
          + txt("", ()=>g.name, v=>{ g.name = v; }, {quiet:true})
          + symbolPicker(GOAL_SYMBOLS, g.symbol, s => { g.symbol = s; refreshSheet(); }))
        + card(sect("Target")
          + fldS("Amount needed", ()=>g.target, v=>g.target=v, {min:50000,max:50000000,step:50000})
          + fldS("Target year", ()=>g.targetYear, v=>g.targetYear=v, {min:2026,max:2050,step:1}))
        + card(sect("Where the money sits")
          + segmented(["Liquid / FD","Equity"], g.bucket === "liquid" ? 0 : 1, i => { g.bucket = i===0?"liquid":"equity"; refreshSheet(); })
          + note(g.bucket === "liquid"
              ? "Safe and steady — right for anything within about 3 years."
              : "Higher growth, higher swings — right for 5+ year horizons.")
          + (warn ? `<div class="note" style="color:${C.goals}">${esc(warn)}</div>` : ""))
        + card(sect("Monthly funding")
          + fldS("Contribution per month", ()=>g.monthly, v=>g.monthly=v, {min:0,max:500000,step:2500})
          + fldS("Annual step-up", ()=>g.stepUpPct, v=>g.stepUpPct=v, {min:0,max:25,step:1,suffix:"%"})
          + toggleS("Start only after the personal loan closes", ()=>g.afterDebtFree, v=>g.afterDebtFree=v))
        + card(sect("Financing")
          + fldS("Pay upfront", ()=>g.downPct, v=>g.downPct=v, {min:10,max:100,step:5,suffix:"%"})
          + (g.downPct < 100
              ? fldS("Loan rate", ()=>g.loanRate, v=>g.loanRate=v, {min:5,max:20,step:0.25,suffix:"%"})
                + fldS("Loan tenure", ()=>g.loanYears, v=>g.loanYears=v, {min:1,max:20,step:1,suffix:"yrs"})
                + row("You save", fmt(fundedTarget(g)), {tint:C.income})
                + row("You finance", fmt(financed(g)), {tint:C.outgo}) : "")
          + note(g.downPct < 100
              ? "Only the upfront share needs saving; the rest becomes an EMI once you buy. Worth it when the loan rate is below your expected investment return."
              : "100% means you buy it outright with no loan."))
        + card(sect("Where you are today")
          + fldS("Already saved for this", ()=>g.actual, v=>g.actual=v, {min:0,max:50000000,step:10000}))
        + card(toggleS("Active", ()=>g.enabled, v=>g.enabled=v))
        + (isNew ? "" : `<div class="addbtn danger" onclick="RUN('${H(()=>{ STORE.config.goals = STORE.config.goals.filter(x=>x.id!==g.id); save(); closeSheet(); if(STACK.length) back(); })}')">${icon("trash",18)}<span>Delete this goal</span></div>`);
    },
    onDone(){
      if (!g.name.trim()) return;
      const i = STORE.config.goals.findIndex(x => x.id === g.id);
      if (i >= 0) STORE.config.goals[i] = g; else STORE.config.goals.push(g);
      save();
    }
  });
}

function editRecurring(original, isNew){
  const p = Object.assign({}, original);
  const keys = Object.keys(FREQ);
  openSheet({
    title: isNew ? "New payment" : "Edit payment",
    body(){
      const m = Math.round(p.anchorMonth) - 1;
      const name = MONTHS_LONG[m] || "that month";
      const label = { monthly:"Due every month.", quarterly:`Due in ${name} and every third month after.`,
                      halfYearly:`Due in ${name} and six months later.`, yearly:`Due each ${name}.` }[p.frequency];
      return card(sect("What is it?")
          + txt("", ()=>p.name, v=>{ p.name = v; }, {quiet:true})
          + symbolPicker(PAY_SYMBOLS, p.symbol, s => { p.symbol = s; refreshSheet(); }))
        + card(sect("How much, how often")
          + fldS("Amount each time", ()=>p.amount, v=>p.amount=v, {min:0,max:1000000,step:1000})
          + segmented(keys.map(k=>FREQ[k].label), keys.indexOf(p.frequency), i => { p.frequency = keys[i]; refreshSheet(); })
          + row("Works out to", `${fmt(perYear(p))}/yr · ${fmt(perMonthAvg(p))}/mo`, {tint:C.outgo, em:true}))
        + card(sect("When")
          + fldS("Month it falls due", ()=>p.anchorMonth, v=>p.anchorMonth=v, {min:1,max:12,step:1})
          + fldS("Starting year", ()=>p.anchorYear, v=>p.anchorYear=v, {min:2026,max:2040,step:1})
          + note(label)
          + note("For quarterly or half-yearly items, pick any one month it's due — the rest are worked out from there."))
        + card(toggleS("Grows with inflation", ()=>p.inflate, v=>p.inflate=v)
          + toggleS("Active", ()=>p.enabled, v=>p.enabled=v)
          + note("Premiums and fees usually rise every year. Turn this off for anything fixed."))
        + (isNew ? "" : `<div class="addbtn danger" onclick="RUN('${H(()=>{ STORE.config.recurring = STORE.config.recurring.filter(x=>x.id!==p.id); save(); closeSheet(); })}')">${icon("trash",18)}<span>Delete this payment</span></div>`);
    },
    onDone(){
      if (!p.name.trim()) return;
      const i = STORE.config.recurring.findIndex(x => x.id === p.id);
      if (i >= 0) STORE.config.recurring[i] = p; else STORE.config.recurring.push(p);
      save();
    }
  });
}

/* sheet-local field variants: re-render the sheet, not the screen */
function fldS(label, get, set, o){
  o = o || {};
  const k = H(v => { const n = parseFloat(v); set(isFinite(n) ? n : 0); refreshSheet(); });
  const val = get();
  return `<div class="fld"><div class="top"><label>${esc(label)}</label>`
    + `<input type="number" inputmode="decimal" value="${val}" onchange="RUNV('${k}', this.value)">`
    + (o.suffix ? `<span class="sfx">${esc(o.suffix)}</span>` : "") + `</div>`
    + (o.min !== undefined ? `<input type="range" min="${o.min}" max="${o.max}" step="${o.step||1}" value="${Math.min(o.max,Math.max(o.min,val))}"
        oninput="this.closest('.fld').querySelector('input[type=number]').value=this.value"
        onchange="RUNV('${k}', this.value)">` : "") + `</div>`;
}
function toggleS(label, get, set){
  const k = H(() => { set(!get()); refreshSheet(); });
  return `<div class="toggle" onclick="RUN('${k}')"><span>${esc(label)}</span><span class="sp"></span>`
       + `<span class="sw${get()?" on":""}"><i></i></span></div>`;
}

/* ---------------- monthly check-in ---------------- */
function openCheckIn(){

  openSheet({

      return card(`<div class="row"><span style="color:${ahead?C.income:C.goals};display:flex">${icon(ahead?"checkmark.seal.fill":"exclamationmark.triangle.fill",22)}</span>`
          + `<div><div style="font-size:15px;font-weight:700">${esc(ahead ? fmt(bd.drift)+" ahead of plan" : fmt(-bd.drift)+" behind plan")}</div>`
          + `<div class="note">Plan expects ${esc(fmt(bd.planned))} invested by now</div></div></div>`, {tight:true})
        + card(sect("Liquid investments")
          + fldS("US stocks", ()=>a.usValue, v=>a.usValue=v, {min:0,max:10000000,step:10000})
          + fldS("India stocks + MF", ()=>a.inValue, v=>a.inValue=v, {min:0,max:10000000,step:10000})
          + fldS("Emergency fund (FD + savings)", ()=>a.fdSavings, v=>a.fdSavings=v, {min:0,max:2000000,step:10000}))
        + (c.goals.length ? card(sect("Saved per goal")
          + c.goals.map(g => fldS(g.name, ()=>g.actual, v=>g.actual=v, {min:0,max:50000000,step:10000})).join("")
          + note("Equity-bucket goals are funded from the same pool as your stocks — record what you've earmarked for each.")) : "")
        + card(sect("Retirement accounts")
          + fldS("EPF balance", ()=>a.epf, v=>a.epf=v, {min:0,max:10000000,step:50000})
          + fldS("NPS balance", ()=>a.nps, v=>a.nps=v, {min:0,max:5000000,step:50000}))
        + card(sect("Debt")
          + fldS("Personal loan outstanding", ()=>a.plOutstanding, v=>a.plOutstanding=v, {min:0,max:1000000,step:10000}))
        + card(linkCardInline("arrow.left.arrow.right","What is my drift costing me?", C.goals, ()=>{ closeSheet(); go("impact"); })
          + linkCardInline("function","How is drift calculated?", C.wealth, ()=>{ closeSheet(); go("drift"); })
          + linkCardInline("chart.xyaxis.line","History & trends", C.wealth, ()=>{ closeSheet(); SEGSTATE.wealth = 2; setTab(3); })
          + note("Property values and insurance live in Settings — they change rarely."));
    },
    onDone(){
      const a = STORE.actuals;
      const sim = simulate(c, a.usValue, a.inValue);
      const bd = driftBreakdown(sim.planNow(), c, a);
      a.lastUpdated = new Date().toISOString();
      const nw = netWorthOf(a, c, STORE.cards).net;
      const liquidGoals = c.goals.filter(g => g.enabled && g.bucket === "liquid").reduce((t,g)=> t + (g.actual||0), 0);
      addSnapshot({ id:uid(), date:new Date().toISOString(), us:a.usValue, ind:a.inValue,
                    carFund:liquidGoals, fdSavings:a.fdSavings, epf:a.epf, nps:a.nps,
                    loanOutstanding:a.plOutstanding, netWorth:nw, planned:bd.planned });
      save();
      if (c.driftAlert > 0 && Math.abs(bd.drift) > c.driftAlert){
        const real = simulate(c, a.usValue, a.inValue, actualsOverride(a, c.goals));
        setTimeout(()=> alert(deviationSummary(bd.drift, goalImpacts(sim, real, c))), 250);
      }
    },
    onCancel(){ save(); }
  });
}
function linkCardInline(symbol, title, tint, onTap){

}

/* ---------------- backup ---------------- */
function exportData(){
  const blob = new Blob([JSON.stringify(STORE, null, 2)], {type:"application/json"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "wealthpilot-backup-" + new Date().toISOString().slice(0,10) + ".json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 2000);
}
function importData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = () => {
    const f = inp.files && inp.files[0]; if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      try{
        const b = JSON.parse(rd.result);
        if (b.config) STORE.config = Object.assign(defaultConfig(), b.config);
        if (b.actuals) STORE.actuals = Object.assign(defaultActuals(), b.actuals);
        STORE.history = b.history || [];
        if (b.cards) STORE.cards = b.cards;
        STORE.privacy = !!b.privacy; PRIVACY = STORE.privacy;
        STORE.theme = b.theme || "system";
        STORE.onboarded = true;
        _simCache.key = null;
        save(); applyTheme(); render();
        alert("Backup restored.");
      }catch(e){ alert("That file didn't look like a WealthPilot backup."); }
    };
    rd.readAsText(f);
  };
  inp.click();
}

/* ---------------- boot ---------------- */
function applyTheme(){
  document.documentElement.setAttribute("data-theme", STORE.theme === "system" ? "" : STORE.theme);
  if (STORE.theme === "system") document.documentElement.removeAttribute("data-theme");
}

    + `<div style="display:flex;gap:5px;justify-content:center;padding:2px 0 6px">${dots}</div>`
    + stepBody.body
    + `<div class="addbtn center" style="background:${C.wealth};color:#fff;justify-content:center;font-size:15px"
         onclick="RUN('${H(()=>{ if (isLast) onbFinish(false); else { ONB++; save(); render(); } })}')">`
    + (isLast ? "Start using WealthPilot" : "Continue") + `</div>`
    + (ONB === 0
        ? `<div class="note t3 center" style="padding-bottom:8px">Just exploring? <b onclick="RUN('${H(()=>onbFinish(true))}')" style="color:var(--wealth);cursor:pointer">Skip and look around with sample data</b></div>`
        : "")
    + `</div>`;
  app.scrollTop = 0;
}

/* onboarding field: re-renders the wizard rather than the tab screen */
function fldO(label, get, set, o){
  o = o || {};
  const k = H(v => { const n = parseFloat(v); set(isFinite(n) ? n : 0); save(); render(); });
  const val = get();
  return `<div class="fld"><div class="top"><label>${esc(label)}</label>`
    + `<input type="number" inputmode="decimal" value="${val}" onchange="RUNV('${k}', this.value)">`
    + (o.suffix ? `<span class="sfx">${esc(o.suffix)}</span>` : "") + `</div>`
    + (o.min !== undefined ? `<input type="range" min="${o.min}" max="${o.max}" step="${o.step||1}" value="${Math.min(o.max,Math.max(o.min,val))}"
        oninput="this.closest('.fld').querySelector('input[type=number]').value=this.value"
        onchange="RUNV('${k}', this.value)">` : "") + `</div>`;
}

/* Home-screen icon + manifest, generated in-page so this stays a single file. */
function installMeta(){
  try{
    const cv = document.createElement("canvas");
    cv.width = cv.height = 512;
    const g = cv.getContext("2d");
    const grad = g.createLinearGradient(0,0,512,512);
    grad.addColorStop(0, "#292A6B"); grad.addColorStop(1, "#1A5C7A");
    g.fillStyle = grad; g.fillRect(0,0,512,512);
    g.strokeStyle = "#F09930"; g.lineWidth = 34; g.lineCap = "round"; g.lineJoin = "round";
    g.beginPath(); g.moveTo(96,368); g.lineTo(200,256); g.lineTo(288,320); g.lineTo(416,150); g.stroke();
    g.beginPath(); g.arc(416,150, 30, 0, Math.PI*2); g.fillStyle = "#FFFFFF"; g.fill();
    const png = cv.toDataURL("image/png");
    const link = document.createElement("link");
    link.rel = "apple-touch-icon"; link.href = png;
    document.head.appendChild(link);
    const mf = { name:"WealthPilot", short_name:"WealthPilot", start_url:".", scope:".",
      display:"standalone", background_color:"#EFEFF4", theme_color:"#595CD9",
      icons:[{ src:png, sizes:"512x512", type:"image/png", purpose:"any maskable" }] };
    const ml = document.createElement("link");
    ml.rel = "manifest";
    ml.href = URL.createObjectURL(new Blob([JSON.stringify(mf)], {type:"application/manifest+json"}));
    document.head.appendChild(ml);
  }catch(e){ /* icon is cosmetic — never block boot */ }
}

load();
PRIVACY = STORE.privacy;
applyTheme();
render();
installMeta();
window.addEventListener("error", e => console.error("WealthPilot:", e.message));

</script>
